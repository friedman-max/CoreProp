name: ios

on:
  push:
    # `feat/**` as well as main. This job is the only real BUILD gate for the
    # SwiftUI app target: the dev box has no Xcode and no iOS SDK, so nothing
    # local links, generates code, reads the asset catalogue or checks
    # entitlements and @objc selector spelling. Before, an iOS-17-only API first
    # appeared on someone else's push to main.
    #
    # It is no longer the only *typecheck* gate. `ios/localcheck/typecheck-all.sh`
    # shims the iOS-only API and type-checks all 31 app files against the macOS
    # SDK at `arm64-apple-macos13.0` — the iOS 16 peer, which is what makes
    # iOS-17-only API fail locally. Run that before pushing; it is seconds, and it
    # covers the account/auth files that nothing else could reach. What it cannot
    # do is everything in the paragraph above, plus real iOS availability (the
    # macOS/iOS pairing is a convention, not a contract). See its README.
    #
    # Scoped twice over, because this one runs on macos-15 and those runner
    # minutes are billed at a multiple of ubuntu's: `feat/**` rather than '**',
    # and the existing `paths` filter still applies, so a branch that touches no
    # Swift never starts it.
    branches: [main, 'feat/**']
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The latest XcodeGen (installed below) emits a project in Xcode 16's
      # objectVersion (77), which older Xcodes can't read ("future Xcode project
      # file format (77)"). Select the newest Xcode present on the runner so the
      # generated project always opens, regardless of the image's default.
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Show Xcode
        run: xcodebuild -version && swift --version

      # 1. Verify the platform-agnostic core (models, API client, EV/payout
      #    math, backtest scoring) with the assertion runner — the same check
      #    that runs on a bare Command Line Tools machine.
      - name: Verify CorePropKit
        working-directory: ios/CorePropKit
        run: |
          swift build
          swift run CorePropKitVerify

      # 2. Regenerate the Xcode project from project.yml and build the app for
      #    the iOS Simulator (no signing needed) — proves the whole SwiftUI app
      #    compiles, which the offline machine can't fully type-check.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (iOS Simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CoreProp.xcodeproj \
            -scheme CoreProp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40
