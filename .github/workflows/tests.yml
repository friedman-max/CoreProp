name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          # Supabase env vars are stubbed in tests/conftest.py; CI overrides
          # them here so even a stray `os.environ.setdefault` race can't
          # accidentally pick up a real value.
          SUPABASE_URL: https://ci.supabase.invalid
          SUPABASE_SERVICE_KEY: ci-service-key
          SUPABASE_ANON_KEY: ci-anon-key
        run: |
          python -m pytest tests/ -q --tb=short
