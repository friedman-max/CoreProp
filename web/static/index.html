.bt-leg-side-under{color:var(--blue-2);background:rgba(96,165,250,.16)}

/* Result pill — never empty; shows actual stat number, DNP, P, ✓/✕, or — */
.bt-slip-compact .bt-leg-actual{
  /* 71px fits the widest realistic stat ("106.5" — 3 digits + decimal at 15px
   * JetBrains Mono + 24px padding). This is a min-width, not a width, because
   * both this pill and .bt-leg-pct sit in `auto` grid tracks: if the pill can
   * shrink, a leg showing "5.5" gets narrower tracks than one showing "106.5"
   * and BOTH badge columns in that leg shift right relative to its siblings —
   * within the same card. Measured ragged by 9-18px before this. */
  min-width:71px;
  padding:var(--s-2) var(--s-3);
  border-radius:var(--r-sm);
  font-size:15px;
  font-weight:800;
  text-align:center;
  font-family:"JetBrains Mono",monospace;
  border:1px solid transparent;
}
/* THESE (0,3,0) copies are the ones that render: page-backtest.jsx emits
 * .bt-leg-actual in exactly one place, inside `<article class="bt-slip
 * bt-slip-compact …">`, so a result-pill colour has to be migrated HERE. The
 * (0,2,0) `.bt-leg-actual.leg-*` rules far above cover the same states and are
 * unreachable for `color`. Both sets were migrated anyway — a stale value on an
 * unreachable rule is how the typography pass lost a whole micro-label.
 *
 * leg-miss WAS a fourth red. It carried #FECACA — lighter than --red-2 (#FCA5A5),
 * which is what the unreachable base copy uses — so the two miss pills disagreed
 * and the one you could see was the untokenized one. The --red-2 guard cannot
 * catch that: it bans a value, and #FECACA is a different value. Resolved by
 * picking --red-2, measured rather than assumed:
 *
 *   the pill's own fill is rgba(239,68,68,.34) over the card, and the card is
 *   rgba(239,68,68,.22) over --bg, so the text sits on rgb(121,38,40)
 *     #FECACA (what shipped) .... 6.84:1
 *     --red-2 #FCA5A5 ........... 5.22:1
 *   and across the other three card tints a miss leg can appear on (a Flex WIN,
 *   a push, a pending card) --red-2 runs 5.76 / 5.97 / 5.80:1.
 *
 * The pill is 15px/800, which is NOT WCAG "large text" (>=18.66px bold), so the
 * bar is 4.5:1 and --red-2 clears it everywhere with room. The lighter red was
 * therefore not doing contrast work, which is the thing that had to be checked
 * before choosing — if it had been, the answer would have been that the BASE
 * rule was wrong and #FECACA needed a token.
 *
 * What decided it: --red-2 is what the LOSS badge in this same card already uses
 * (.bt-slip-badge.is-loss), so the card was rendering two different reds side by
 * side, and miss was the only one of the four outcome pills not matching its
 * badge sibling (hit and push already pair with --green-2 / --amber-2). One red
 * for one meaning.
 *
 * #FECACA survives at .ev-row-data.is-logged, where it is a different problem
 * with its own note (it exists because --text-3 fell under AA once the logged
 * tint was flattened) — that is not this red wearing a disguise.
 *
 * leg-dnp's #D1D5DB stays literal: the neutral "did not play" grey has no family
 * and no token, and inventing one for a single site is not an improvement. */
.bt-slip-compact .bt-leg-actual.leg-hit    {background:rgba(34,197,94,.28);  color:var(--green-2); border-color:rgba(34,197,94,.45)}
.bt-slip-compact .bt-leg-actual.leg-miss   {background:rgba(239,68,68,.34);  color:var(--red-2);   border-color:rgba(239,68,68,.65)}
.bt-slip-compact .bt-leg-actual.leg-push   {background:rgba(251,191,36,.26); color:var(--amber-2); border-color:rgba(251,191,36,.45)}
.bt-slip-compact .bt-leg-actual.leg-dnp    {background:rgba(156,163,175,.22);color:#D1D5DB;        border-color:rgba(156,163,175,.4)}
.bt-slip-compact .bt-leg-actual.leg-pending{background:rgba(251,191,36,.22); color:var(--amber-2); border-color:rgba(251,191,36,.4)}

/* ─────────── mobile / narrow-screen fixes ───────────
 * The density-override block above redeclares `.ev` and `.cp-nav` grids
 * unconditionally (later source order), which silently killed the earlier
 * `@media (max-width:1100px)` collapse for `.ev` and left the top nav with no
 * mobile treatment at all. These rules live at the very end of the stylesheet
 * so they win by source order, restoring a usable layout on phones/tablets. */

/* Top nav: on narrow screens the 3-column grid + 6 wrapping tabs piled up and
 * overlapped the logo/user. Reflow to flex: logo + account on row 1, the tab
 * strip on a full-width horizontally-scrollable row 2. */
@media (max-width:820px){
  .cp-nav{
    display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);
    padding:var(--s-3) clamp(var(--s-4),3vw,var(--s-6));
  }
  .cp-nav-l{order:1;margin-right:auto}
  .cp-nav-r{order:2}
  .cp-nav-c{
    order:3;flex:1 1 100%;flex-wrap:nowrap;justify-content:flex-start;
    gap:var(--s-2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    /* The negative side margin must equal .cp-nav's clamp MINIMUM above, or the
     * scrollable tab strip stops bleeding flush to the nav edge on the narrow
     * phones where 3vw is below that minimum. Both sides read --s-4 so they
     * cannot drift; the matching positive padding keeps the first/last tab off
     * the bezel while the strip is scrolled to either end.
     * The padding was `2px var(--s-4) 4px` — two literals either side of the
     * bezel token. Both are now --s-1: the 4px bottom was already on the scale
     * and the 2px top was not exemptible beside it (this test judges a
     * declaration whole), so the strip gains 2px of top pad. The `margin`'s own
     * 2px top nudge stays literal and IS exempt — its other two parts are 0 and
     * a derived calc(), so nothing >= 4px sits in it. */
    scrollbar-width:none;margin:2px calc(-1 * var(--s-4)) 0;padding:var(--s-1) var(--s-4);
  }
  .cp-nav-c::-webkit-scrollbar{display:none}
  .cp-tab{flex:0 0 auto}
}

/* The two landing overrides that used to live here (a stats-strip overflow fix
 * and a horizontal-scroll fix for the fake "live board" demo table) are gone
 * with the elements they targeted. The replacement sections size from
 * intrinsic minimums — every landing grid uses minmax(0,1fr) tracks and fluid
 * type — so they need no width-specific patches. */

/* +EV page: collapse the 1fr/360px split to a single column and un-stick the
 * slip builder so it flows below the table instead of pinning a fixed-height
 * sidebar next to a crushed main column. */
@media (max-width:900px){
  .ev{grid-template-columns:1fr}
  /* Third copy of .ev-main's padding; the fourth is at the bottom of this
   * stylesheet (@media 900, mobile bezel parity) and overrides all of it. */
  .ev-main{padding-bottom:var(--s-8)}

  /* Desktop sidebar is gone on mobile; the slip builder lives in a dropdown
   * that falls out of the config tile instead. Two-class selector to beat the
   * base `.ev-slip{display:flex}`. */
  .ev-slip.ev-slip-desktop{display:none}

  /* Slip Builder toggle: a full-width grey bar pinned to the BOTTOM of the
   * config tile, centered, below the Clear button. `order:1` forces it after
   * every filter field regardless of wrap order; the negative margins let it
   * span the tile edge-to-edge and sit flush on the tile's bottom border so it
   * reads as part of the tile. Squared bottom corners when open so the panel
   * below looks continuous. */
  /* Fixed --s-4 (16px) side padding so the toggle's negative margin below can
   * span exactly to the tile edges. The toggle's negative margin now READS
   * --s-4 (`calc(-1 * var(--s-4))`) so that half can no longer drift; its
   * `100% + 32px` basis is still that same 16px doubled by hand, because `flex`
   * and `width` are outside the spacing invariant and this pass did not touch
   * them. If --s-4 ever moves, the 32px moves with it. */
  .ev-filters{padding:var(--s-4) var(--s-4) 0}
  .ev-slip-toggle{
    display:flex;order:1;box-sizing:border-box;
    /* basis = full content width + the tile's 16px padding on each side, so
     * the negative margins bleed it flush to the tile edges (own row). */
    flex:0 0 calc(100% + 32px);width:calc(100% + 32px);
    margin:var(--s-1) calc(-1 * var(--s-4)) 0;
    padding:var(--s-3) var(--s-4);border-radius:0 0 calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px);
    border-left:0;border-right:0;border-bottom:0;
    border-top:1px solid var(--hair);
  }
  .ev-slip-toggle.is-on{border-radius:0}

  /* The dropdown: rendered right after .ev-filters, pulled up flush against it
   * (negative top margin over the tile's 14px bottom gap) so it looks like it
   * fell out of the config tile. Same surface + side borders as the tile,
   * squared top corners, rounded bottom. Hidden until .is-open.
   * --card, deliberately NOT the desktop .ev-slip's --bg-2: "same surface as the
   * tile" is what makes the drawer read as part of .ev-filters, and the join
   * between them is borderless (border-top:0), so any mismatch shows up as a
   * seam straight across the phone +EV screen. It must track .ev-filters. */
  .ev-slip.ev-slip-mobile{
    /* The negative top margin must equal .ev-filters' margin-bottom exactly —
     * both read --s-4 so the drawer stays flush against the tile. */
    display:none;margin:calc(-1 * var(--s-4)) 0 var(--s-4);position:static;height:auto;
    background:var(--card);
    border:1px solid var(--hair);border-top:0;
    border-radius:0 0 var(--r-lg) var(--r-lg);
    padding:var(--s-4) var(--s-5) var(--s-5);flex-direction:column;gap:var(--s-4);
    animation:evSlipDrop .22s ease both;
  }
  .ev-slip.ev-slip-mobile.is-open{display:flex}
  @keyframes evSlipDrop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* Belt-and-braces only. This block used to also carry `.ev-row{min-width:620px}`,
   * which paired with .ev-table's clipped overflow to make the row scroll
   * horizontally on a phone — and measured at 375px, that put the entire right
   * zone (the hero true% AND the add button) at x 515-617 while the visible
   * table ended at 359, i.e. completely off-screen and unreachable without
   * discovering a horizontal scroll. The airy row stacks instead of demanding
   * 620px, so the minimum is gone and nothing needs the scroll. Kept because
   * wrapping book chips could still overflow a viewport narrower than any we
   * target; it should never actually engage.
   *
   * The three .is-logged flat-tint overrides that lived here are gone too: they
   * existed only because the desktop gradient's faded .06 end was invisible once
   * the user scrolled past the PLAYER column. Their values are now the base
   * rules (see .ev-row-data.is-logged), so both viewports finally agree. */
  .ev-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
}

/* Board/backtest filter bars: let the pagination + badge wrap under the
 * inputs instead of forcing horizontal overflow on small screens. */
@media (max-width:560px){
  .bd-filters,.ev-filters{gap:var(--s-3)}
  .bd-badge{margin-left:0}
  .bd-pag{margin-left:auto}
  /* The .ev-player / .ev-player-n un-truncation that used to live here is now
   * unconditional — see those rules. It applied only below 560px while the row
   * was a narrow-tracked grid; the airy row gives the name the full width, so
   * there is no width at which truncating is the better trade. */
}

/* Mobile bezel parity: on phones/tablets the board & analytics tabs (Combined
 * Lines, PrizePicks, Sportsbooks, Backtest, Analytics — all `.bd-page`) were
 * far narrower than the +EV tab. `.bd-page` carries a desktop gutter cap
 * (max-width: calc(100vw - 48px) + margin:0 auto = 24px each side) which, on
 * top of its 22px padding, left a ~46px bezel — double the +EV page's ~22px.
 * Below the point where the +EV layout collapses to one column, drop that cap
 * so every tab fills the screen edge-to-edge with the same small bezel as +EV. */
@media (max-width:900px){
  .bd-page{max-width:none;margin:0;padding:var(--s-5) var(--s-4) 60px}
  .ev-main{padding:var(--s-5) var(--s-4) var(--s-8)}
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<!-- Precompiled bundles (see build.sh). These are the esbuild output of the
     web/static/*.jsx sources — plain global scripts, loaded in dependency
     order. @babel/standalone was removed from the page: the browser no longer
     downloads ~600KB of Babel or transforms JSX on the main thread at load.
     After editing any .jsx, run ./build.sh and commit web/static/dist/. -->
<!-- ?v= is a content-derived cache-bust token, STAMPED BY build.sh from a hash
     of the built bundles (do not hand-edit — ./build.sh rewrites it on every
     build). All ten tags share one token so a client can never mix bundles
     from two different builds (a cross-file global mismatch that throws in
     render and blanks the page). sw.js's cache name is stamped with the same
     id so activate() purges prior builds. See build.sh + app-main.jsx
     ErrorBoundary. -->
<script src="/static/dist/api.js?v=52056c1e31"></script>
<script src="/static/dist/tweaks-panel.js?v=52056c1e31"></script>
<script src="/static/dist/components.js?v=52056c1e31"></script>
<script src="/static/dist/landing.js?v=52056c1e31"></script>
<script src="/static/dist/ev-page.js?v=52056c1e31"></script>
<script src="/static/dist/page-boards.js?v=52056c1e31"></script>
