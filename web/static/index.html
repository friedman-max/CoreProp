.bd-edge-cell.is-edge{color:var(--green)}


/* ═══════════════════════════════════════════ BACKTEST ═══════════════════════════════════════════ */
.bt-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.bt-card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column}
/* Reserve two label lines on every card so a wrapping "(sub)" doesn't push
 * one card's value down relative to its neighbors — the values must sit on a
 * common baseline across the row. */
.bt-card-label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-3);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-height:2.4em;line-height:1.25}
.bt-card-sub{font-size:9.5px;opacity:.7;text-transform:none;letter-spacing:0}
.bt-card-value{font-size:22px;font-weight:700;margin-top:auto;padding-top:6px;letter-spacing:-.01em;font-family:"JetBrains Mono",monospace}
.bt-card.tone-good .bt-card-value{color:var(--green)}
.bt-card.tone-bad  .bt-card-value{color:#FCA5A5}

/* Loading skeleton — shown instead of computed-from-empty zeros while the
 * first fetch is in flight, so a refresh never flashes misleading 0/0 / 0.0%
 * placeholder numbers. */
@keyframes cpShimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.cp-skel{display:inline-block;border-radius:var(--r-sm);background:#1a1a26;background-image:linear-gradient(90deg,#1a1a26 0px,#24243400 40px,#242434 80px,#1a1a26 120px);background-size:200px 100%;background-repeat:no-repeat;animation:cpShimmer 1.15s ease-in-out infinite}
.bt-card-value .cp-skel{height:22px;width:64px;vertical-align:middle}
.bt-card-label .cp-skel{height:11px;width:90px}

.bt-slips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.bt-slip{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.bt-slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.65}
.bt-slip.is-win::before{background:linear-gradient(180deg,var(--green),rgba(34,197,94,.2))}
.bt-slip.is-loss::before{background:linear-gradient(180deg,var(--red),rgba(239,68,68,.2))}
.bt-slip.is-push::before{background:linear-gradient(180deg,#FBBF24,rgba(251,191,36,.2))}
.bt-slip.is-pending::before{background:linear-gradient(180deg,#60A5FA,rgba(96,165,250,.2))}
.bt-slip-hd{display:flex;justify-content:space-between;align-items:center}
.bt-slip-hd-l{display:flex;flex-direction:column;gap:2px}
.bt-slip-type{font-size:12.5px;font-weight:700}
.bt-slip-ts{font-size:11px;color:var(--text-3);font-family:"JetBrains Mono",monospace}
.bt-slip-badge{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:var(--r-sm)}
.bt-slip-badge.is-win{background:rgba(34,197,94,.14);color:#86EFAC}
.bt-slip-badge.is-loss{background:rgba(239,68,68,.14);color:#FCA5A5}
.bt-slip-badge.is-push{background:rgba(251,191,36,.14);color:#FDE68A}
.bt-slip-badge.is-pending{background:rgba(96,165,250,.14);color:#93C5FD}
/* --text-3, not --text-4: this is an interactive control's icon, not a
 * decorative glyph. --text-4 put the resting ✕ at 2.21:1, under the 3:1 WCAG
 * 1.4.11 floor for non-text UI, and only the hover state cleared it — a control
 * you can't see until you point at it. --text-3 is 5.66:1 on this surface. */
.bt-slip-del{background:transparent;border:1px solid var(--hair-2);color:var(--text-3);width:24px;height:24px;border-radius:var(--r-sm);cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.bt-slip-del:hover{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:#FCA5A5}

/* Delete-slip confirmation modal (reuses .cp-modal-back / .cp-modal shell). */
.bt-del-modal{width:min(420px,92vw);text-align:center;padding:28px 26px 22px}
.bt-del-icon{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
.bt-del-title{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--text)}
.bt-del-body{margin:0 0 6px;font-size:13.5px;line-height:1.5;color:var(--text-2)}
.bt-del-error{margin:10px 0 0;font-size:12.5px;color:#FCA5A5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--r-sm);padding:8px 10px}
.bt-del-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.bt-del-actions .cp-btn{min-width:118px;padding:10px 16px}
.bt-del-confirm{background:var(--red,#ef4444);color:#fff;border:1px solid var(--red,#ef4444)}
.bt-del-confirm:hover:not(:disabled){background:#dc2626;border-color:#dc2626}
.bt-del-confirm:disabled{opacity:.6;cursor:default}

.bt-slip-legs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.bt-slip-leg{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.bt-slip-leg:last-child{border-bottom:0}
.bt-leg-i{width:18px;height:18px;background:#0a0a12;border-radius:var(--r-sm);display:grid;place-items:center;font-size:10px;color:var(--text-3);font-weight:700}
.bt-leg-body{min-width:0}
.bt-leg-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-leg-prop{font-size:11.5px;color:var(--text-3)}
.bt-leg-pct{font-size:12px;color:var(--text-2);font-family:"JetBrains Mono",monospace}
.bt-leg-actual{font-size:13px;font-weight:700;font-family:"JetBrains Mono",monospace;padding:2px 8px;border-radius:var(--r-sm)}
.bt-leg-actual.leg-hit{background:rgba(34,197,94,.14);color:#86EFAC}
.bt-leg-actual.leg-miss{background:rgba(239,68,68,.14);color:#FCA5A5}
.bt-leg-actual.leg-push{background:rgba(251,191,36,.14);color:#FDE68A}
.bt-leg-actual.leg-dnp,.bt-leg-actual.leg-pending{background:rgba(96,165,250,.14);color:#93C5FD}

.bt-slip-foot{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--hair);gap:8px}
.bt-slip-foot-c{display:flex;flex-direction:column;gap:2px;flex:1}
.bt-slip-foot-k{font-size:10px;color:var(--text-3);letter-spacing:.04em;font-weight:600}
.bt-slip-foot-v{font-size:13px;font-weight:700}
.tone-good{color:var(--green)!important}
.tone-bad{color:#FCA5A5!important}

/* ═══════════════════════════════════════════ ANALYTICS + OBSERVATORY shared ═══════════════════════════════════════════ */
.an-panel{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px}
.an-panel-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.an-panel-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.an-section-sub{font-size:12px;color:var(--text-3)}
.an-section-h{margin:20px 0 10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:10px}

/* Analytics stacks TWO .bt-summary groups in one panel (7 window-stat cards,
 * then 3 CLV cards). The shared rule uses auto-fit, whose empty tracks COLLAPSE
 * — so the 3-card group stretched each card to 419px directly beneath 204px
 * cards, and no column lined up between the groups. Pin an explicit 4-column
 * grid here: 7 cards wrap 4+3 and 3 cards fill the first three tracks, so card
 * N of either group sits on the same x as card N of the other. Backtest keeps
 * auto-fit (one 6-card group, where auto-fill would leave a dead track). */
.an-page .bt-summary{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.an-page .bt-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.an-page .bt-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.an-page .bt-summary{grid-template-columns:1fr}}

.pnl-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.pnl-title{font-size:13px;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.pnl-total{font-size:34px;font-weight:800;letter-spacing:-.02em;font-family:"JetBrains Mono",monospace;line-height:1.1;margin-top:4px}
.pnl-hover{color:var(--text-3);font-size:13px;font-family:"JetBrains Mono",monospace}

/* The P&L and reliability charts are static displays. touch-action:pan-y lets a
   vertical drag scroll the page normally while a horizontal drag does nothing
   (so it can't "slip" into an accidental scroll); user-select:none stops the SVG
   from being selected/highlighted when you drag a finger across it on mobile.
   NB: do NOT add pointer-events:none here — it is inherited by the child
   <circle> marks and would kill the ReliabilityChart's native <title> hover
   tooltips (both charts share the .pnl-chart class). user-select handles the
   selection concern on its own; pointer-events is unnecessary. */
.pnl-chart{margin:0 -4px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pnl-chart svg{display:block;width:100%;-webkit-user-select:none;user-select:none}

.pnl-range{display:inline-flex;gap:2px;background:#0a0a12;border:1px solid var(--hair);padding:3px;border-radius:var(--r-sm);margin-top:8px}
.pnl-range-btn{background:transparent;border:0;color:var(--text-3);padding:6px 12px;border-radius:var(--r-sm);font-weight:600;font-size:11.5px;cursor:default;letter-spacing:.04em;font-family:"JetBrains Mono",monospace}
.pnl-range-btn:hover{color:var(--text)}
.pnl-range-btn.is-on{background:#1f1f2e;color:white}
/* The Custom range button gets the app's accent blue when active so it reads
 * as the special "opens a picker" option and ties visually to the picker's
 * focus ring. */
.pnl-range-btn.is-custom.is-on{background:var(--primary);color:#fff}

/* Custom date-range picker — matches the segmented range control above it (same
 * inset panel + radius) with two rounded date fields and the accent blue focus
 * ring used everywhere else in the app. */
.pnl-custom{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;background:#0a0a12;border:1px solid var(--hair);padding:6px 8px;border-radius:var(--r-md)}
.pnl-custom-field{display:inline-flex;align-items:center;gap:8px}
.pnl-custom-field>span{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text-3);font-family:"JetBrains Mono",ui-monospace,monospace}
.pnl-custom-input{background:#14141e;border:1px solid var(--hair-2);color:var(--text);border-radius:var(--r-sm);padding:7px 10px;font-size:12.5px;font-family:"JetBrains Mono",ui-monospace,monospace;outline:none;color-scheme:dark;cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease}
.pnl-custom-input:hover{border-color:var(--primary-2)}
.pnl-custom-input:focus{border-color:var(--primary);box-shadow:var(--ring)}
.pnl-custom-arrow{color:var(--text-4);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}

/* Calibration curves.
 * --bg, not --card: this is a chart *well* nested inside .an-panel, so it has to
 * stay darker than its own container to read as sunk rather than stacked. Its
 * old gradient (#0c0c14 -> #0a0a12) already sat below --bg-2, so --bg is the
 * closest token, not a lightening.
 * Note: no JSX, bundle or HTML references .cal-curves / .cal-legend* today —
 * the whole cal-* family is currently unrendered CSS. Flattened rather than
 * deleted so the rule stays consistent with its neighbours if the calibration
 * chart comes back; removing the dead family is its own change. */
.cal-curves{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-md);padding:18px 18px 12px;margin-bottom:14px;min-height:380px}
.cal-curves svg{display:block;width:100%}
.cal-legend{display:flex;flex-wrap:wrap;gap:16px;padding:4px 6px 0;font-family:Inter,system-ui,sans-serif}
.cal-legend-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);font-weight:500}
.cal-legend-item i{width:18px;height:3px;border-radius:2px;display:inline-block}
.cal-legend-dashed{background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 5px,transparent 5px 9px)!important;height:1.5px!important}

/* Per-prop multiplier table */
.obs-mult-wrap,.obs-heat-wrap{overflow:auto}
.obs-mult,.obs-heat{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.obs-mult thead th,.obs-heat thead th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--hair);white-space:nowrap}
.obs-mult tbody td,.obs-heat tbody td{padding:8px 14px;border-bottom:1px solid var(--hair)}
.obs-th-c{text-align:center!important}
.obs-mult-cell{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:var(--r-sm);min-width:90px}
.obs-mult-n{font-size:10px;color:var(--text-3);font-family:"JetBrains Mono",monospace;margin-top:2px}

/* Heatmap */
.obs-heat-prop{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13px;font-weight:500;color:var(--text-2)}
.obs-heat-prop .bt-leg-side{margin-left:auto}
.obs-heat-cell{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:600;border-right:1px solid rgba(255,255,255,.04)}
.obs-heat-cell.is-empty{color:var(--text-4);font-weight:400}
.obs-heat-v{display:block;padding:2px 0;border-radius:4px;font-weight:700}
.obs-heat-n{display:block;font-size:9.5px;font-weight:500;color:var(--text-3);margin-top:1px;letter-spacing:.02em}
.obs-heat-cell{padding:8px 12px;text-align:center}

.obs-feed-filters{display:flex;gap:24px;margin-bottom:14px;flex-wrap:wrap}
.an-feed-count{font-weight:400;color:var(--text-3);font-size:13px;margin-left:6px}
.obs-pill{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:var(--r-sm);display:inline-block}

/* ─────────── density overrides: tighten dead space, fill standard screens ─────────── */
/* Strategy: scale containers with viewport. Landing sections use fluid widths
 * with a generous cap; app pages (bd-page, ev, pp) fill all but a small gutter.
 * Result: a 1920px monitor shows full-bleed content; a 1440px screen shows the
 * same proportional layout with no center-pinned dead bands. */
/* Landing: every section reads its width from --lp-max (set in the .lp block
 * above), so widening the page on a large monitor is one declaration rather
 * than a per-section list that has to be kept in step. This used to be 14
 * rules, four of which targeted elements the page no longer renders.
 * A measure cap stays in place at very large sizes — the landing page is
 * mostly prose, and 1640px of running text is unreadable. */
@media (min-width:1400px){.lp{--lp-max:1240px}}

/* App pages: full-bleed within a small gutter; tables get their full screen. */
/* One shared page gutter: `clamp(var(--s-6),2.5vw,var(--s-10))` on .cp-nav (above),
 * .bd-page and .ev-main. Keep the three identical — the nav is sticky over the
 * page, so any divergence shows as the nav's logo/tabs stepping in or out
 * relative to the content beneath it. 60/80px bottom padding is scroll runway,
 * not a gutter, and stays off the scale. */
.bd-page{max-width:min(1820px,calc(100vw - var(--s-12)));padding:var(--s-5) clamp(var(--s-6),2.5vw,var(--s-10)) 60px}
.ev{grid-template-columns:1fr 360px}
.ev-main{padding:var(--s-6) clamp(var(--s-6),2.5vw,var(--s-10)) 80px}
.ev-slip{padding:var(--s-6) var(--s-5)}
/* Pricing page: single centered column. The page has no side column, so the
 * pricing card, header, FAQ and trust strip all center within a comfortable
 * reading width. (A previous build forced a 2-col grid with an empty 360px
 * track, which shoved the card off-center.) */
/* 56px has no step on the scale (--s-12 is 48px, the next would be 64px) and
 * --lp/:root is out of bounds for this phase, so the clamp's max stays literal
 * while its min moves onto the shared --s-6 gutter. */
.pp{max-width:760px;margin:0 auto;padding:var(--s-12) clamp(var(--s-6),3vw,56px) 80px}
.pp-card-wrap{max-width:560px;margin:0 auto}

/* Topnav: spread tabs across the full width on wide screens. This copy wins over
 * the base .cp-nav rule (same specificity, later source order) and drops its
 * safe-area calc()s — that is pre-existing, not part of the spacing migration.
 * The gutter clamp is the shared page gutter: keep it identical to .ev-main and
 * .bd-page below or the nav's edge stops lining up with the page content. */
.cp-nav{padding:var(--s-3) clamp(var(--s-6),2.5vw,var(--s-10));grid-template-columns:auto 1fr auto;gap:var(--s-6)}
.cp-nav-c{gap:6px}
.cp-tab{padding:var(--s-3) var(--s-5)}

/* Filter bars in app pages: keep them visually grouped at any width. These two
 * win over the base rules above; the base rules keep the surface/border/radius. */
.ev-filters{padding:var(--s-5) clamp(var(--s-6),2.5vw,var(--s-8))}
.bd-filters{padding:var(--s-4) clamp(var(--s-4),2vw,var(--s-6))}

/* Tables: take full container width with sensible per-cell padding. Both of
 * these also win over their base rules; head and body must keep the same
 * horizontal clamp or the sticky header's labels stop sitting over their own
 * column. */
.bd-tbl thead th{padding:var(--s-3) clamp(var(--s-4),1.4vw,var(--s-5))}
.bd-tbl tbody td{padding:var(--s-3) clamp(var(--s-4),1.4vw,var(--s-5))}
/* These two re-declare the base .ev-row / .ev-row-hd padding at the SAME
 * specificity but later in source order, so THESE are the copies that win. Both
 * must carry --row-px, or .is-sel / .is-logged compensate against a value the
 * row does not actually have. */
.ev-row{padding:var(--s-4) var(--row-px)}
.ev-row-hd{padding:var(--s-4) var(--row-px)}

/* +EV: Save-preferences button below Min Leg % */
.ev-prefs-save{
  margin-top:8px;width:100%;
  background:var(--primary);
  /* --r-md to match .cp-btn-save, the other full-width primary CTA in this
   * sidebar. The two stack directly adjacent, so 8px against 12px read as a
   * mistake once the glows that used to distract from it were removed. */
  color:white;border:0;border-radius:var(--r-md);
  padding:10px;font-size:13px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;white-space:nowrap;
  transition:transform .08s ease, background .2s ease;
}
/* Flat: no white inset, no blue drop-glow, and no hover lift. The hover now
 * DARKENS to --primary's hover shade like .cp-btn-primary (lightening puts
 * white-on-blue under 4.5:1), and the press is the same 1px push .cp-btn uses —
 * this button does not carry .cp-btn, so it needs its own.
 *
 * `background-color`, NOT the `background` shorthand: the saved/error state
 * classes below are `.ev-prefs-save-*` (0,1,0) while this is 0,2,0, so a
 * shorthand here would win the whole background and turn a just-saved green
 * button accent-blue on hover. Setting only the color layer leaves their opaque
 * background-IMAGE gradient painting on top, so the state colours survive.
 *
 * :not(:disabled) because this button is disabled while prefs load and while
 * saving — a hover response there advertises a click that does nothing. (The
 * old hover LIFTED a disabled button, since :disabled never reset transform.) */
.ev-prefs-save:hover:not(:disabled){background-color:#195F97}
.ev-prefs-save:active{transform:translateY(1px)}
.ev-prefs-save:disabled{opacity:.7;cursor:default}
.ev-prefs-save-saved{background:linear-gradient(180deg,#16a34a,#15803d)}
.ev-prefs-save-error{background:linear-gradient(180deg,#dc2626,#b91c1c)}

/* Big Save-preferences bar at the bottom of the +EV main column. */
/* Backtest slip card: Place-on-PrizePicks button at the bottom */
/* `margin-top:auto` pins the CTA to the bottom of the card's flex column.
 * The cards in a row are stretched to equal height by the grid, but the legs
 * list is content-sized — so without this the button floats up right after the
 * last leg and a 2-leg card's CTA sat up to 262px above its 6-leg neighbour's,
 * with dead space beneath it. Now every card's CTA shares one baseline. */
.bt-slip-place{
  margin-top:auto;width:100%;
  background:var(--primary);
  color:white;border:0;border-radius:var(--r-sm);
  padding:9px 12px;font-size:12.5px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;white-space:nowrap;
  transition:transform .08s ease, background .2s ease;
}
/* Flat, hover DARKENS, `background-color` only, and not while disabled — see
 * .ev-prefs-save:hover for all three reasons. Here the shorthand would also
 * flatten the install <a>'s and the queued/error/sending gradients. */
.bt-slip-place:hover:not(:disabled){background-color:#195F97}
.bt-slip-place:active{transform:translateY(1px)}
.bt-slip-place:disabled{opacity:.55;cursor:default;transform:none}
.bt-slip-place-queued{background:linear-gradient(180deg,#16a34a,#15803d)}
.bt-slip-place-error{background:linear-gradient(180deg,#dc2626,#b91c1c)}
/* In-flight state needs to look distinct from idle, or a slow connection reads
   as an unresponsive button and the user clicks again. */
.bt-slip-place-sending{background:linear-gradient(180deg,#4b5563,#374151);cursor:progress}
/* Rendered as an <a> to the install page when no extension is detected. */
.bt-slip-place-install{
  display:block;text-align:center;text-decoration:none;
  background:linear-gradient(180deg,#1e3a5f,#15304f);color:#9fd0f5;
  box-shadow:none;border:1px solid #26527f;
}
.bt-slip-place-install:hover{background:linear-gradient(180deg,#26527f,#1b3d63);color:#cfe8fb}
/* Placement messages get their own classes — these used to borrow
   .bt-del-error from the delete-slip modal, so restyling deletion silently
   restyled betting errors. */
.bt-place-note{margin:8px 0 0;font-size:11.5px;color:#94a3b8;line-height:1.5}
.bt-place-error{margin:8px 0 0;font-size:12.5px;color:#FCA5A5;background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.25);border-radius:var(--r-sm);padding:7px 9px;line-height:1.5}

/* ─────────── Backtest cards: 3-up grid, bigger, more legible ─────────── */
.bt-slips-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
@media (max-width:1080px){.bt-slips-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.bt-slips-grid{grid-template-columns:1fr}}

.bt-slip-compact{
  padding:16px 18px;
  gap:10px;
  border-radius:var(--r-md);
  border-width:2px;
}
/* Stronger color treatment so a losing card reads as "RED" at a glance. */
.bt-slip-compact.is-win    {
  border-color:rgba(34,197,94,.65);
  background:linear-gradient(180deg,rgba(34,197,94,.16),rgba(34,197,94,.06));
  box-shadow:inset 4px 0 0 var(--green), 0 6px 20px -10px rgba(34,197,94,.4);
}
.bt-slip-compact.is-loss   {
  border-color:rgba(239,68,68,.75);
  background:linear-gradient(180deg,rgba(239,68,68,.22),rgba(239,68,68,.08));
  box-shadow:inset 4px 0 0 var(--red), 0 6px 20px -10px rgba(239,68,68,.5);
}
.bt-slip-compact.is-pending{
  border-color:rgba(251,191,36,.60);
  background:linear-gradient(180deg,rgba(251,191,36,.14),rgba(251,191,36,.04));
  box-shadow:inset 4px 0 0 #FBBF24, 0 6px 20px -10px rgba(251,191,36,.35);
}
.bt-slip-compact.is-push   {
  border-color:rgba(251,191,36,.40);
  background:linear-gradient(180deg,rgba(251,191,36,.08),transparent);
  box-shadow:inset 4px 0 0 rgba(251,191,36,.6);
}

/* Header strip */
.bt-slip-compact .bt-slip-hd{align-items:center;margin-bottom:4px;gap:10px}
.bt-slip-compact .bt-slip-hd-l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.bt-slip-compact .bt-slip-hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bt-slip-compact .bt-slip-type{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--text)}
.bt-slip-compact .bt-slip-ts{font-size:12px;color:var(--text-3)}
.bt-slip-compact .bt-slip-badge{font-size:10.5px;padding:4px 10px;letter-spacing:.10em;font-weight:800}

/* Slip-level +EV % badge */
.bt-slip-ev{
  font-family:"JetBrains Mono",monospace;
  font-size:11.5px;font-weight:800;letter-spacing:.04em;
  padding:4px 9px;border-radius:var(--r-sm);
  white-space:nowrap;
}
.bt-slip-ev.is-pos{color:#86EFAC;background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.40)}
.bt-slip-ev.is-neg{color:#FCA5A5;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.40)}

/* Leg rows: player + prop on the left, True % in the middle, actual on the right */
.bt-slip-compact .bt-slip-legs{gap:4px}
.bt-slip-compact .bt-slip-leg{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  padding:8px 4px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.bt-slip-compact .bt-leg-pct{
  font-size:12.5px;
  font-weight:700;
  color:var(--primary-2);
  font-family:"JetBrains Mono",monospace;
  padding:2px 7px;
  border-radius:var(--r-sm);
  background:rgba(30,111,176,.10);
  border:1px solid rgba(30,111,176,.22);
  min-width:50px;text-align:center;
}
.bt-slip-compact .bt-slip-leg:last-child{border-bottom:0}

/* Player name row — name + game time. Only the name truncates; the time is
   held at its full width so "PM"/"AM" is never clipped to an ellipsis. */
.bt-leg-name{
  display:flex;
  align-items:baseline;
  gap:8px;
  font-size:15.5px;
  font-weight:800;
  letter-spacing:-.005em;
  color:var(--text);
  line-height:1.2;
}
.bt-leg-player{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
/* Game start time next to the player name — muted mono, doesn't compete with it */
.bt-leg-time{
  flex:0 0 auto;
  white-space:nowrap;
  font-family:"JetBrains Mono",monospace;
  font-weight:600;
  font-size:11px;
  letter-spacing:.01em;
  color:var(--text-3);
}

/* Prop type + league + side+line — clearly readable, not muted into invisibility */
.bt-leg-prop{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;
  color:var(--text-2);
  margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bt-leg-league{
  font-weight:800;letter-spacing:.05em;
  color:var(--text);
  font-size:11px;
  background:rgba(255,255,255,.06);
  padding:2px 7px;border-radius:var(--r-sm);
  flex-shrink:0;   /* the league pill is short and fixed — only the prop name shrinks */
}
/* The prop NAME is the only part of this row that may be shortened. Without
 * `min-width:0` a flex item won't shrink below its text width, so the row
 * overflowed to the right and `margin-left:auto` pushed the side/line pill
 * clean outside the container's clip — the actual bet line ("▼51.5") vanished
 * entirely on narrow cards while a long prop name ("Pts+Rebs+Asts") stayed
 * fully rendered. Now the name ellipsises and the line is always visible. */
.bt-leg-prop-name{color:var(--text);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-leg-side{font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:.02em;font-size:13px;padding:3px 8px;border-radius:var(--r-sm);margin-left:auto;flex-shrink:0}
.bt-leg-side-over{color:#86EFAC;background:rgba(34,197,94,.16)}
.bt-leg-side-under{color:#93C5FD;background:rgba(96,165,250,.16)}

/* Result pill — never empty; shows actual stat number, DNP, P, ✓/✕, or — */
.bt-slip-compact .bt-leg-actual{
  /* 71px fits the widest realistic stat ("106.5" — 3 digits + decimal at 15px
   * JetBrains Mono + 24px padding). This is a min-width, not a width, because
   * both this pill and .bt-leg-pct sit in `auto` grid tracks: if the pill can
   * shrink, a leg showing "5.5" gets narrower tracks than one showing "106.5"
   * and BOTH badge columns in that leg shift right relative to its siblings —
   * within the same card. Measured ragged by 9-18px before this. */
  min-width:71px;
  padding:6px 12px;
  border-radius:var(--r-sm);
  font-size:15px;
  font-weight:800;
  text-align:center;
  font-family:"JetBrains Mono",monospace;
  border:1px solid transparent;
}
.bt-slip-compact .bt-leg-actual.leg-hit    {background:rgba(34,197,94,.28);  color:#86EFAC; border-color:rgba(34,197,94,.45)}
.bt-slip-compact .bt-leg-actual.leg-miss   {background:rgba(239,68,68,.34);  color:#FECACA; border-color:rgba(239,68,68,.65)}
.bt-slip-compact .bt-leg-actual.leg-push   {background:rgba(251,191,36,.26); color:#FDE68A; border-color:rgba(251,191,36,.45)}
.bt-slip-compact .bt-leg-actual.leg-dnp    {background:rgba(156,163,175,.22);color:#D1D5DB; border-color:rgba(156,163,175,.4)}
.bt-slip-compact .bt-leg-actual.leg-pending{background:rgba(251,191,36,.22); color:#FDE68A; border-color:rgba(251,191,36,.4)}

/* ─────────── mobile / narrow-screen fixes ───────────
 * The density-override block above redeclares `.ev` and `.cp-nav` grids
 * unconditionally (later source order), which silently killed the earlier
 * `@media (max-width:1100px)` collapse for `.ev` and left the top nav with no
 * mobile treatment at all. These rules live at the very end of the stylesheet
 * so they win by source order, restoring a usable layout on phones/tablets. */

/* Top nav: on narrow screens the 3-column grid + 6 wrapping tabs piled up and
 * overlapped the logo/user. Reflow to flex: logo + account on row 1, the tab
 * strip on a full-width horizontally-scrollable row 2. */
@media (max-width:820px){
  .cp-nav{
    display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);
    padding:var(--s-3) clamp(var(--s-4),3vw,var(--s-6));
  }
  .cp-nav-l{order:1;margin-right:auto}
  .cp-nav-r{order:2}
  .cp-nav-c{
    order:3;flex:1 1 100%;flex-wrap:nowrap;justify-content:flex-start;
    gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    /* The negative side margin must equal .cp-nav's clamp MINIMUM above, or the
     * scrollable tab strip stops bleeding flush to the nav edge on the narrow
     * phones where 3vw is below that minimum. Both sides read --s-4 so they
     * cannot drift; the matching positive padding keeps the first/last tab off
     * the bezel while the strip is scrolled to either end. */
    scrollbar-width:none;margin:2px calc(-1 * var(--s-4)) 0;padding:2px var(--s-4) 4px;
  }
  .cp-nav-c::-webkit-scrollbar{display:none}
  .cp-tab{flex:0 0 auto}
}

/* The two landing overrides that used to live here (a stats-strip overflow fix
 * and a horizontal-scroll fix for the fake "live board" demo table) are gone
 * with the elements they targeted. The replacement sections size from
 * intrinsic minimums — every landing grid uses minmax(0,1fr) tracks and fluid
 * type — so they need no width-specific patches. */

/* +EV page: collapse the 1fr/360px split to a single column and un-stick the
 * slip builder so it flows below the table instead of pinning a fixed-height
 * sidebar next to a crushed main column. */
@media (max-width:900px){
  .ev{grid-template-columns:1fr}
  /* Third copy of .ev-main's padding; the fourth is at the bottom of this
   * stylesheet (@media 900, mobile bezel parity) and overrides all of it. */
  .ev-main{padding-bottom:var(--s-8)}

  /* Desktop sidebar is gone on mobile; the slip builder lives in a dropdown
   * that falls out of the config tile instead. Two-class selector to beat the
   * base `.ev-slip{display:flex}`. */
  .ev-slip.ev-slip-desktop{display:none}

  /* Slip Builder toggle: a full-width grey bar pinned to the BOTTOM of the
   * config tile, centered, below the Clear button. `order:1` forces it after
   * every filter field regardless of wrap order; the negative margins let it
   * span the tile edge-to-edge and sit flush on the tile's bottom border so it
   * reads as part of the tile. Squared bottom corners when open so the panel
   * below looks continuous. */
  /* Fixed --s-4 (16px) side padding so the toggle's negative margin below can
   * span exactly to the tile edges. .ev-slip-toggle's `-16px` / `100% + 32px`
   * are that same 16px doubled — keep them in step by hand. */
  .ev-filters{padding:var(--s-4) var(--s-4) 0}
  .ev-slip-toggle{
    display:flex;order:1;box-sizing:border-box;
    /* basis = full content width + the tile's 16px padding on each side, so
     * the negative margins bleed it flush to the tile edges (own row). */
    flex:0 0 calc(100% + 32px);width:calc(100% + 32px);
    margin:4px -16px 0;
    padding:13px 16px;border-radius:0 0 calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px);
    border-left:0;border-right:0;border-bottom:0;
    border-top:1px solid var(--hair);
  }
  .ev-slip-toggle.is-on{border-radius:0}

  /* The dropdown: rendered right after .ev-filters, pulled up flush against it
   * (negative top margin over the tile's 14px bottom gap) so it looks like it
   * fell out of the config tile. Same surface + side borders as the tile,
   * squared top corners, rounded bottom. Hidden until .is-open.
   * --card, deliberately NOT the desktop .ev-slip's --bg-2: "same surface as the
   * tile" is what makes the drawer read as part of .ev-filters, and the join
   * between them is borderless (border-top:0), so any mismatch shows up as a
   * seam straight across the phone +EV screen. It must track .ev-filters. */
  .ev-slip.ev-slip-mobile{
    /* The negative top margin must equal .ev-filters' margin-bottom exactly —
     * both read --s-4 so the drawer stays flush against the tile. */
    display:none;margin:calc(-1 * var(--s-4)) 0 var(--s-4);position:static;height:auto;
    background:var(--card);
    border:1px solid var(--hair);border-top:0;
    border-radius:0 0 var(--r-lg) var(--r-lg);
    padding:var(--s-4) var(--s-5) var(--s-5);flex-direction:column;gap:var(--s-4);
    animation:evSlipDrop .22s ease both;
  }
  .ev-slip.ev-slip-mobile.is-open{display:flex}
  @keyframes evSlipDrop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* The 9-column row grid can't fit a phone, and .ev-table clips overflow —
   * which previously hid the rightmost "+" add-to-slip button entirely,
   * making the slip builder unusable on mobile. Let the table scroll
   * horizontally (like the board tables) and pin a row min-width so the
   * columns keep readable widths instead of crushing/wrapping. */
  .ev-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ev-row{min-width:620px}

  /* Logged rows are now identified by colour alone (the LOGGED badge is gone),
   * so the colour has to survive that horizontal scroll. The desktop gradient
   * fades to .06 alpha by the right-hand end of the row, which is invisible
   * once the user scrolls past the PLAYER column — and the 3px red left border
   * has scrolled off screen by then too. Flat tint instead: same red, readable
   * at every scroll offset. */
  .ev-row-data.is-logged{background:rgba(239,68,68,.16) !important}
  .ev-row-data.is-logged:hover{background:rgba(239,68,68,.22) !important}
  .ev-row-data.is-logged.is-sel{background:rgba(239,68,68,.26) !important}
}

/* Board/backtest filter bars: let the pagination + badge wrap under the
 * inputs instead of forcing horizontal overflow on small screens. */
@media (max-width:560px){
  .bd-filters,.ev-filters{gap:var(--s-3)}
  .bd-badge{margin-left:0}
  .bd-pag{margin-left:auto}

  /* Full player name on phones.
   *
   * .ev-player-n is `white-space:nowrap; text-overflow:ellipsis` by default,
   * which is a reasonable desktop tradeoff because hovering shows the title
   * tooltip — phones have no hover, so a truncated name is unrecoverable.
   * Let it wrap onto a second line instead of truncating; the row is already
   * a grid with auto height, so wrapping costs vertical space only.
   *
   * `overflow-wrap:anywhere` is the guard that keeps the name inside its own
   * track: wrapping alone only breaks at spaces, so a single long token
   * ("Alexander-Arnold") still painted over the LEAGUE pill next door, since
   * this rule also sets overflow:visible. */
  .ev-player{align-items:flex-start}
  .ev-player-n{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;overflow-wrap:anywhere}
}

/* Mobile bezel parity: on phones/tablets the board & analytics tabs (Combined
 * Lines, PrizePicks, Sportsbooks, Backtest, Analytics — all `.bd-page`) were
 * far narrower than the +EV tab. `.bd-page` carries a desktop gutter cap
 * (max-width: calc(100vw - 48px) + margin:0 auto = 24px each side) which, on
 * top of its 22px padding, left a ~46px bezel — double the +EV page's ~22px.
 * Below the point where the +EV layout collapses to one column, drop that cap
 * so every tab fills the screen edge-to-edge with the same small bezel as +EV. */
@media (max-width:900px){
  .bd-page{max-width:none;margin:0;padding:var(--s-5) var(--s-4) 60px}
  .ev-main{padding:var(--s-5) var(--s-4) var(--s-8)}
}
</style>
</head>
