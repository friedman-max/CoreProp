<style>
/* ─────────── tokens ─────────── */
:root{
  --bg:        #0a0a0d;
  --bg-2:      #11111a;
  --card:      #14141e;
  --card-2:    #1a1a25;
  --card-3:    #22222f;
  --hair:      rgba(255,255,255,.06);
  --hair-2:    rgba(255,255,255,.10);
  --text:      #f4f4f8;
  --text-2:    #b9b9c8;
  /* --text-3 is the muted-label colour used site-wide (column headers, "true %"
   * captions, sub-labels). It was #7a7a8b, which measures 4.34:1 on --card —
   * just under the 4.5:1 AA floor, so every small caption on a raised surface
   * failed while the identical text on the page background (4.69:1) passed.
   * #8a8a9b clears it on both (5.4 / 5.8). */
  --text-3:    #8a8a9b;
  /* --text-4 is 2.3:1 and is for DISABLED/decorative glyphs only. Never use it
   * for text a user has to read — see the .lp-foot-disc and .pp-respo notes. */
  --text-4:    #4a4a59;
  /* Accent is the blue lifted out of the logo wordmark (logo_full.png), not a
   * template indigo. Both values are used FLAT — there are no accent gradients
   * anywhere in this stylesheet on purpose, enforced by
   * tests/api_tests/test_css_guards.py::test_no_accent_gradients.
   *
   * The pair exists because one blue can't do both jobs accessibly:
   *   --primary   is only ever a FILL or a BORDER, never text. It's dark enough
   *               that white text on it clears WCAG AA (5.3:1). The brighter
   *               #2E90D9 it replaced measured 3.44:1 with white on top, so
   *               every primary button's label was failing.
   *   --primary-2 is only ever TEXT or an icon on the dark page (9.5:1). It is
   *               far too light to put white on.
   * Keep that split: swapping one for the other silently breaks contrast. */
  --primary:   #1E6FB0;
  --primary-2: #6FBCEC;
  --primary-hi:rgba(30,111,176,.22);
  /* Row-level accent tint. --primary-hi (.22) was tuned for focus rings and
   * badges, where it sits under --primary-2 (7.16:1). Behind a row it is
   * inherited by .ev-time's --text-3 and measures 4.45:1 — under the AA floor
   * the :root note above documents. .10 is the most-tinted stop of the gradient
   * it replaced, so the flat fill holds that gradient's exact worst case and
   * keeps --text-3 at 5.03:1 (see .ev-row-data.is-sel). -hi/-lo mark tint
   * FAMILY, not intensity: --red-hi is also .10. */
  --primary-lo:rgba(30,111,176,.10);
  --green:     #22C55E;
  /* --green-2, --amber-2 and --blue-2 are the same shape as --red-2 below: the
   * light TEXT colour that reads on a tint of its base, where the base is the
   * fill or the border. Same split as --primary/--primary-2, and just as
   * non-interchangeable. This one is the hit / positive / OVER label.
   *
   * It is NOT a button fill — that is --save, a third green, for the reason
   * written there. All four already existed on iOS
   * (ios/CoreProp/Theme/Theme.swift: green2/amber2/blue2/saveGreen) and three of
   * that file's doc comments cited a web token that did not exist yet, because
   * the phase that introduced --red-2 migrated only the red. */
  --green-2:   #86EFAC;
  --green-hi:  rgba(34,197,94,.14);
  /* The save/confirm/committed-action button FILL, and deliberately not --green:
   * --green is the semantic outcome colour (a result bar, a "+EV" number, a hit
   * border) and this is the fill under a white button label, so the two have to
   * be free to move independently. Like --primary it is fill/border only, never
   * text.
   *
   * It was #16A34A, and white on that measures 3.30:1 — over the 3:1 non-text
   * floor, under the 4.5:1 body-text minimum, so every white label on it failed
   * AA. There were five: .cp-btn-save (15px/700), .ev-prefs-save-saved
   * (13px/700), .bt-slip-place-queued (12.5px/700), and the Green Devils chip
   * (12.5px/500) and GD badge (11px/700), the last two inline in ev-page.jsx.
   * The token being one place is what made it one fix.
   *
   * Darkened one step down the same ramp to #15803D, where white is 5.02:1. That
   * is the identical move --primary took for the identical reason (#2E90D9 at
   * 3.44:1 -> #1E6FB0 at 5.31:1), and the note up there records it the same way;
   * the two contrast claims were computed with the same WCAG 2.x curve, so they
   * are comparable numbers. The hue is HELD, not just "close": 142.4deg against
   * 142.1deg, with --green (#22C55E) at 142.1 and --green-2 (#86EFAC) at 141.7
   * on the same ramp, so the family still reads as one green rather than as a
   * green and a teal.
   *
   * Darkening the FILL and not the label is the deliberate half. White-on-green
   * is the save-button idiom, the app's other primary CTA is white-on---primary,
   * and a dark label on green would make .cp-btn-save the only control of its
   * kind in the app.
   *
   * #15803D used to BE .cp-btn-save's hover, so the hover moves down a step too,
   * to #166534 (white 7.13:1). It still has a single consumer and no sibling, so
   * it stays literal — as does the disabled pair at .cp-btn-save.is-dis; see the
   * note there, which also carries this value's 8-digit form.
   *
   * ios/CoreProp/Theme/Theme.swift's `saveGreen` is still #16A34A and its doc
   * comment still states the pre-fix 3.30:1 finding as live. Porting this is an
   * iOS change; no test pins that mirror, so it will not fail loudly.
   *
   * One coincidence, recorded rather than fixed: app-main.jsx's accent picker
   * offers #15803D as a user-selectable accent, so a user who picks the green
   * accent gets --primary == --save. Cosmetic, and only off the default. */
  --save:      #15803D;
  --red:       #EF4444;
  /* The lighter error/miss red, for TEXT on a red tint. --red (#EF4444) is the
   * semantic red for bars, borders and fills; this one is what reads on top of
   * one (8.5-10.7:1 over the logged-row tints, where --text-3 measures 3.6-4.6
   * and fails AA). Not interchangeable — see the .is-logged note. */
  --red-2:     #FCA5A5;
  --red-hi:    rgba(239,68,68,.10);
  /* WARNING amber, and it has ZERO consumers in this stylesheet — on purpose, so
   * that the next audit finds a decision here instead of re-raising it.
   *
   * The obvious precedent says delete: --radius-xs had no consumers and was
   * deleted in Phase 2b, with test_legacy_radius_aliases_point_at_the_new_scale
   * now asserting its absence. This is the other call, and three things separate
   * the two cases:
   *
   *   1. It is not actually dead as a VALUE. web/static/extension.html spells
   *      #f59e0b as its own `--warn` and paints .dot.off (the "extension not
   *      connected" status dot) with it. That file is deliberately standalone —
   *      no React, no shared stylesheet, so it still renders for an expired
   *      session — which means it cannot read :root and its copy is not one of
   *      the five roles test_extension_palette_mirror_matches pins. So web has a
   *      warning surface; the app SHELL is the part that has none.
   *   2. ios/CoreProp/Theme/Theme.swift's `amber` (#F59E0B) is live at four
   *      sites: RootView's banner, ErrorStateView's glyph (Components.swift),
   *      SettingsView's live-mode label and SubscriptionView's lock glyph. This
   *      palette and that one were deliberately made to mirror each other, and
   *      a role the client uses four times is not one web should lose the name
   *      for.
   *   3. Theme.swift's `saveGreen` note keeps an unreferenced iOS token "because
   *      it mirrors a real web token, which is the same reason web keeps --amber
   *      with zero consumers." Deleting it would falsify a written decision in a
   *      file that is not web's to edit, and strand that comment.
   *
   * A radius is geometry and carries no meaning; a colour token is a ROLE. When
   * the app shell grows a warning surface — today its error states use --red-2,
   * which conflates "this failed" with "be careful" — this is what it uses, and
   * --amber-2 below is the light label that reads on a tint of it. Do NOT
   * conflate the two: --amber-2 has consumers and a different base (see its
   * note). */
  --amber:     #F59E0B;
  /* The push label. Its base is the push outcome #FBBF24, NOT --amber — --amber
   * is the WARNING colour, and the two are separate on purpose (the iOS port
   * conflated them, which coupled an outcome to a caution state). So this is the
   * one -2 whose name does not point at the token above it. */
  --amber-2:   #FDE68A;
  /* The pending label. There is no --blue base: the pending blue is a raw
   * #60A5FA at three sites, and tokenizing it is a separate call. Pending reads
   * blue and not amber because it means "not settled yet", not "caution" —
   * test_backtest_pending_is_blue_on_every_surface pins that, and it is why this
   * and --amber-2 must not be swapped for each other despite being adjacent
   * here. */
  --blue-2:    #93C5FD;
  --logo-1:    #7EE7F5;
  --logo-2:    #3DA9F0;
  /* Radius scale. Five steps replace 18 distinct literal sizes. The old names
   * are kept as aliases because six landing rules still reference them; note
   * this is source compatibility, not visual identity (--radius goes 14→16px,
   * --radius-sm 10→12px). ios/CoreProp/Theme/Theme.swift carries the same
   * 14/10/8 triple and is deliberately still on the old values — Phase 4 of the
   * modernization ports this scale there. No test pins that mirror. */
  --r-xl:      20px;   /* the pricing hero only: .pp-card + its derived glow ring */
  --r-lg:      16px;   /* cards, panels, table wrappers, modals */
  --r-md:      12px;   /* inputs, inner tiles, menus, row action buttons */
  --r-sm:      8px;    /* small chips, badges, skeletons, icon buttons */
  --r-pill:    999px;  /* buttons, filter chips */
  --radius:    var(--r-lg);
  --radius-sm: var(--r-md);

  /* Spacing scale. There was none, which is why padding drifted. */
  --s-1:  4px;   --s-2:  8px;   --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px;   --s-8: 32px;   --s-10: 40px; --s-12: 48px;
  /* Derived: the ONLY definition of the +EV row's horizontal padding. Three
   * rules must share it (.ev-row, .is-sel, .is-logged) — a stale literal in one
   * of their calc()s once shipped a 6px misalignment. FOUR DECLARATIONS, not
   * three: .ev-row is written twice (base rule + an unconditional
   * re-declaration in the density-overrides block that wins on source order),
   * and .is-sel / .is-logged each subtract their 3px left bar from it. Both bars
   * are 3px so one compensation value serves both. (A fourth rule, .ev-row-hd,
   * was pinned here until Phase 2a deleted the header row.) */
  --row-px: clamp(var(--s-5), 2vw, var(--s-6));

  /* Elevation. The `0 2px 0 rgba(255,255,255,.03) inset` highlight that used to
   * lead --shadow-card is gone: that inset is the skeuomorphic tell.
   *
   * --shadow-card has exactly TWO consumers — .cp-modal and .pp-card, both of
   * which predate the modernization — and that is now a DECISION, not the
   * omission it looked like. The spec's card recipe reads "flat var(--card) +
   * hairline + --shadow-card at --r-lg", and the flattening pass that removed
   * every card's top-edge falloff named this shadow as the replacement lift. No
   * task ever applied it, so it got MEASURED instead of pasted.
   *
   * Measured in Chromium at 1440px — this stylesheet against the real class
   * names, one render with the shadow off and one with it added to all nine
   * candidates; max diff over the whole 1440x2469 frame was 5/255. Directly
   * under a card's bottom edge the shadow moves the pixel from rgb(10,10,13)
   * (--bg) to rgb(7,7,10), decaying to 1/255 by 16px out. As contrast ratios
   * against the ground the card sits on:
   *     --shadow-card peak on --bg ....... 1.018:1
   *     --shadow-card peak on --card ..... 1.044:1
   *     the --hair border pixel .......... 1.240:1   (on either ground)
   *     --card-2 against --card .......... 1.061:1
   * The 1px hairline every one of these surfaces ALREADY carries is ~13x the
   * shadow's step on the page ground (.240 vs .018 above unity). A drop shadow
   * is a light-mode mechanism: on a #0a0a0d ground a black shadow has nothing
   * to darken. That is also why nobody ever reported the token's absence as a
   * symptom — .pp-card's shipped shadow measures the identical 3/255.
   *
   * Considered and deliberately left flat, all nine of which have a hairline and
   * no shadow: .ev-filters, .ev-table, .bd-tbl-wrap, .bd-filters, .an-panel,
   * .bt-slip (which only ever renders as .bt-slip.bt-slip-compact), .bt-card,
   * .pp-faq details. Five are full-bleed regions, where the shadow's footprint —
   * ~10px below the bottom edge, tapering to nothing at the sides, because the
   * -18px spread pulls the shadow rect 18px INSIDE the border box before the
   * +12px offset pushes it back out — is a 1052px-wide band, not a lift. The
   * rest are grid tiles with siblings on two or three sides.
   * .bt-slip-compact additionally carries a 2px saturated outcome border over a
   * coloured tint, the strongest separation on any surface in the app.
   *
   * What the two live consumers share and the nine do not: each is
   * width-constrained, centred, and the only focal object on its surface, with
   * ground visible on all four sides. .cp-modal is min(420px,92vw) in a
   * place-items:center fixed overlay, over a blurred rgba(4,4,8,.7) scrim — the
   * one place in the app where the shadow separates a card from something other
   * than the flat page ground. .pp-card is the pricing hero inside
   * .pp-card-wrap's max-width:620px/margin:0 auto. Neither tiles against a
   * sibling; neither is full-bleed.
   *
   * The one flatness symptom anyone actually noticed in four phases of review —
   * .bt-card nested in .an-panel, same-tone-on-same-tone — was fixed with a tone
   * step (--card-2; see the note at .an-panel .bt-card), which measures 1.061:1
   * against 1.044:1 for a shadow on that same ground, and needs no scoping. On
   * this palette the elevation LADDER is the separation mechanism and the shadow
   * token is not. If --bg is ever lightened the trade flips, and the cheaper
   * change then is to strengthen this token — which reaches both consumers at
   * once — not to add nine declarations that measure 1.02:1. */
  --shadow-card: 0 12px 32px -18px rgba(0,0,0,.7);
  --shadow-pop:  0 16px 40px -12px rgba(0,0,0,.6);
  --ring:        0 0 0 4px var(--primary-hi);

  /* Height of the sticky .cp-nav. This is a MEASURED number, not a derived one:
   * 67px is what Chromium renders at 1440px in the SIGNED-IN state, where the
   * tallest nav child is a .cp-tab (12px + 12px padding around an ~18px Inter
   * line box = 42px) inside .cp-nav's 12px/12px padding, plus its 1px bottom
   * hairline. It therefore depends on .cp-tab's padding AND its font-size/family
   * — RE-MEASURE it (devtools: `document.querySelector('.cp-nav')
   * .getBoundingClientRect().height`, signed in, fonts loaded) if either moves.
   * It was a hardcoded 65px in three places across two rules (.ev's min-height
   * and .ev-slip's top AND height) and had been wrong in both directions: it
   * over-subtracted by 4px while the nav was 61px, then under-subtracted by 2px
   * once .cp-tab's padding went on the spacing scale, which tucked the top of
   * .ev-slip under the nav.
   *
   * Deliberately ONE desktop value. The nav is 61px signed OUT (no tabs; the
   * 34px .cp-btn-sm pair is then the tallest child) and ~123px below the
   * @media 820 breakpoint, where it reflows to two rows. Both sticky consumers
   * (.ev-slip's top and height) only apply in the desktop signed-in layout —
   * .ev-slip goes position:static at ≤900px — so this value is exact for them.
   * The third consumer, .ev's min-height, is only a floor and is only reachable
   * signed in; below 820 it overshoots the space under the nav by the wrapped
   * nav's extra height (56px at 375px, down from 58px when this was 65px).
   *
   * .lp-hero's `calc(100vh - 62px)` is deliberately NOT on this token: the
   * landing hero is the SIGNED-OUT surface, so 62px approximates the 61px
   * tabless nav. Pointing it at --nav-h would over-subtract by 6px. */
  --nav-h:       67px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* Flat page ground. The two full-bleed radial washes that used to live here
 * (plus the .lp-orb blur discs and .lp-grid-bg overlay in the hero) were the
 * single biggest "generated template" tell on the page and cost real paint
 * time on mobile for decoration nobody reads. Surfaces now separate by
 * elevation and hairlines only. */

/* ─────────── buttons ─────────── */
.cp-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  padding:var(--s-3) var(--s-4);border-radius:var(--r-pill);border:1px solid transparent;
  background:transparent;color:var(--text);font-weight:600;font-size:14px;
  cursor:pointer;transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .2s ease;
  letter-spacing:.005em;white-space:nowrap;
}
.cp-btn:active{transform:translateY(1px)}
/* Flat fill, no vertical gradient and no colored glow. */
.cp-btn-primary{background:var(--primary);color:#fff}
/* Hover DARKENS. Lightening it (the obvious instinct) pushed white-on-blue
 * back under 4.5:1 — a hover state that fails contrast fails while the user
 * is actively pointing at it. */
.cp-btn-primary:hover{background:#195F97}
.cp-btn-ghost{background:transparent;border-color:var(--hair-2);color:var(--text)}
.cp-btn-ghost:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.18)}
/* One height scale, now 34 / 43 / 53px for sm / base / lg — measured in Chromium
 * at 1440 with Inter loaded, against this sheet.
 *
 * It USED to be 34 / 39 / 47 (this note said 46), off a vertical padding of
 * --s-2 / 10px / 13px, and it said 10 and 13 were literal because "no step
 * expresses" them. That was true, and it is exactly the drift the spacing scale
 * exists to remove: a three-rung ladder standing on one token and two hand-typed
 * numbers. The rungs are one step apart on the scale now — --s-2 / --s-3 / --s-4
 * — and the heights fall out of that.
 *
 * The lg rung is the one place plain nearest-step rounding was NOT applied. 13px
 * rounds to --s-3 (12px), which measures 45px against base's 43px and collapses
 * the top two rungs into each other; the ladder's job is to read as three sizes,
 * so lg takes the step ABOVE. Same kind of override the .bt-summary gap takes:
 * the relationship the value encodes outranks the arithmetic. Cost: base grows
 * 4px, lg grows 6px.
 *
 * .cp-btn-save is NOT a rung here (one-off full-width CTA) and does take
 * nearest-step, 13px -> --s-3. It lands on 43px, which is exactly .cp-input's
 * height — those two are the full-width controls that stack in the slip sidebar,
 * and they used to be 45 against 43.
 *
 * sm stays 34px, which is also the height of .cp-input-sm, so the one place a
 * .cp-btn-sm sits beside an input (the slip builder's Min Leg % "Reset") still
 * matches natively instead of being stretched to fit by the flex row.
 *
 * Filter-bar buttons (.bd-clear, .ev-clear, .bd-pag*) are deliberately NOT on
 * this scale — they share a 34px baseline with .bd-badge and .bd-f select, and
 * pulling them to 32 or 43 breaks that row's alignment. */
.cp-btn-sm{padding:var(--s-2) var(--s-4);font-size:13px}
.cp-btn-lg{padding:var(--s-4) var(--s-6);font-size:15px}

/* Keyboard focus. Every interactive control on the page previously had NO
 * visible focus state, which makes the landing page unusable by keyboard and
 * fails WCAG 2.4.7. One rule covers buttons, links, inputs and <summary>. */
:where(button,a,summary,input,select,[tabindex]):focus-visible{
  outline:2px solid var(--primary-2);outline-offset:2px;border-radius:var(--r-sm);
}

/* Honour the OS "reduce motion" setting. prefers-reduced-motion is a
 * vestibular-safety setting, not a preference. The app tabs run row/leg
 * entrance and modal transitions, and the landing hero's minigame animates
 * again (lpNudge/lpDotPop/lpRevealIn/lpBarGrow plus WAAPI FX in landing.jsx)
 * — the minigame relies on this clamp for its CSS side and on
 * lpReducedMotion() for the JS-driven FX. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
}
/* Flat: no white top-edge inset, no green drop-glow. The glow is green rather
 * than accent so the accent-glow guard cannot see it — "flat buttons, no glow"
 * still applies, so it is removed by hand and recorded here. */
.cp-btn-save{background:var(--save);color:white;border-radius:var(--r-md);padding:var(--s-3);font-weight:700;width:100%;font-size:15px;border:0;cursor:pointer}
/* #166534, one ramp step below --save's new #15803D (white 7.13:1 against the
 * base's 5.02:1) — it had to move, because #15803D IS --save now and leaving it
 * would have made the hover a no-op AND spelled a token's value as a literal. */
.cp-btn-save:hover{background:#166534}
/* The one pair in this family that stays literal, and the only tokenizable-looking
 * site that is not tokenizable. Both values are 8-digit hex — --save at 25% alpha
 * and --green-2 at 50% — and `var(--save)40` does NOT concatenate: var()
 * substitutes into the token stream, so the trailing `40` becomes a separate
 * component value and the declaration is invalid at computed-value time.
 * Measured: it computes to rgba(0,0,0,0), i.e. the button loses its fill
 * entirely, and CSS.supports() still answers true because a declaration
 * containing var() defers its validity check. That is a silent no-op, not a
 * failure you would notice in a diff.
 *
 * color-mix(in srgb, var(--save) 25%, transparent) does work and renders the same
 * pixel, and was rejected on two counts: it computes to a `color(srgb …)` value
 * rather than an rgba() one, and 25% is not 0x40 (64/255 = 25.098%) — it only
 * matches because Chromium quantizes the hex's alpha to 8 bits first, so the
 * equality would rest on a rounding behaviour instead of on a value. The
 * stylesheet's existing idiom for "base colour at alpha" is a dedicated rgba()
 * token (--green-hi, --red-hi, --primary-lo), and this state would need two of
 * them for one rule.
 *
 * So: if --save or --green-2 ever moves, these two move BY HAND. Same standing
 * obligation as the 4px in .ev-auto-gd's focus ring. Exempted by whole selector
 * in tests/api_tests/test_css_tokens.py::HEX_LITERAL_OK, which carries the same
 * reasoning and is the only entry in that set.
 *
 * --save DID move (#16A34A -> #15803D), and this is the hand-move it obliged:
 * the fill is #15803d40, not the old #16a34a40.
 *
 * Measured in Chromium off the composited PIXELS, not by hand-compositing the
 * two alphas — the button rendered on each of its real grounds and the fill and
 * glyph colours read back out of the screenshot. The #86EFAC80 label reads
 * 3.81:1 on the desktop sidebar's --bg-2 and 3.72:1 on the mobile drawer's
 * --card, up from 3.60 / 3.53. A disabled control only owes 3:1 (WCAG 1.4.3
 * exempts it outright; 3:1 is the house floor), so both states cleared and the
 * new one clears by more.
 *
 * The cost, and the reason this is worth writing down rather than just noting
 * the pass: the fill's separation from its ground drops 1.40-1.42:1 to
 * 1.26-1.27:1, so the disabled button sits a little flatter against the panel
 * than it did. Still visible, and nothing requires a disabled fill to
 * contrast — but it is the one number this fix made worse. */
.cp-btn-save.is-dis{background:#15803d40;color:#86EFAC80;cursor:not-allowed;box-shadow:none}

.cp-link{background:transparent;border:0;color:var(--primary-2);font-weight:500;cursor:pointer;font-size:13px;padding:var(--s-2);border-radius:var(--r-sm)}
.cp-link:hover{background:rgba(30,111,176,.10)}
.cp-center{text-align:center;align-self:center}

.cp-input{
  background:#0e0e16;border:1px solid var(--hair);color:var(--text);
  border-radius:var(--r-md);padding:var(--s-3) var(--s-4);font-size:14px;width:100%;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
  font-family:inherit;
}
/* --text-3, not --text-4. Placeholder text IS text a user reads — in the +EV
 * prop search it is the only hint of what to type. --text-4 measures 2.21:1 on
 * this input's #0e0e16 fill; --text-3 clears AA at 5.66:1. Same correction
 * already applied to .lp-foot-disc and .pp-respo. */
.cp-input::placeholder{color:var(--text-3)}
.cp-input:focus{border-color:var(--primary);box-shadow:var(--ring)}
/* --s-2 vertical is the measured half of the filter-bar's 34px contract and does
 * not move; only the horizontal 10px was off the scale (-> --s-3, +2px a side).
 * `.bd-f input` carries the identical recipe and must move with it — that pairing
 * is pinned by test_the_padding_derived_filter_inputs_share_one_recipe. */
.cp-input-sm{padding:var(--s-2) var(--s-3);font-size:13px}

/* ─────────── top nav ─────────── */
.cp-nav{
  position:sticky;top:0;z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s-4);
  /* env(safe-area-inset-*) is 0 in a normal browser tab and only non-zero in an
   * installed/standalone PWA on a notched device, so this sticky header clears
   * the status bar / notch instead of rendering underneath it.
   * --s-6 is the page gutter minimum, shared with .ev-main / .bd-page / .pp —
   * see the density-overrides copy of this rule, which wins on source order. */
  padding:calc(var(--s-3) + env(safe-area-inset-top)) calc(var(--s-6) + env(safe-area-inset-right)) var(--s-3) calc(var(--s-6) + env(safe-area-inset-left));
  backdrop-filter:blur(18px);
  background:rgba(10,10,13,.78);border-bottom:1px solid var(--hair);
}
.cp-nav.is-landing{background:rgba(10,10,13,.55)}
/* Only in the installed app: keep content off the home indicator. */
@media (display-mode: standalone){ body{ padding-bottom: env(safe-area-inset-bottom); } }
.cp-logo-btn{background:transparent;border:0;cursor:pointer;padding:0}
.cp-logo{display:flex;align-items:center;gap:var(--s-2)}
/* logo_full.png is now a transparent-background wordmark, so the artwork
 * sits cleanly on the dark nav with no rectangular edge. We keep it free of
 * any drop-shadow glow per the brand look. The "showHalo" tweak stays a
 * no-op for the wordmark. */
.cp-mark-img{display:block;transition:transform .8s cubic-bezier(.3,1.4,.4,1)}
.cp-logo-btn:hover .cp-mark-img.is-spin{transform:rotate(-6deg) scale(1.04)}
.app.no-halo .cp-mark-img{filter:none}
.cp-mark{filter:drop-shadow(0 0 12px rgba(94,180,235,.4))}
.cp-mark.is-spin{transition:transform .8s cubic-bezier(.3,1.4,.4,1)}
.cp-logo-btn:hover .cp-mark{transform:rotate(-12deg) scale(1.06)}
/* .cp-word is gone: Logo renders the wordmark as an <img> (logo_full.png),
 * so there has been no text node to style since that switch. */
.cp-nav-c{display:flex;gap:var(--s-1);align-items:center;justify-content:center;flex-wrap:wrap}
.cp-tab{
  background:transparent;border:0;color:var(--text-2);
  /* Re-declared in the density-overrides block (wider tabs on big screens);
   * that copy wins on source order, so both have to move together. */
  padding:var(--s-3) var(--s-4);border-radius:var(--r-pill);font-size:13.5px;font-weight:500;
  cursor:pointer;transition:background .15s ease, color .15s ease;
  white-space:nowrap;
}
.cp-tab:hover{background:rgba(255,255,255,.04);color:var(--text)}
.cp-tab.is-active{background:#1d1d2a;color:#fff;border:1px solid var(--hair-2)}
.cp-nav-r{display:flex;gap:var(--s-3);align-items:center}
.cp-user{position:relative;display:flex;align-items:center}
.cp-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:white;font-weight:700;font-size:13px}
/* Profile button — just the avatar; clicking it opens the account dropdown. */
.cp-avatar-btn{display:flex;align-items:center;background:transparent;border:1px solid transparent;border-radius:50%;padding:0;cursor:pointer;transition:.15s}
.cp-avatar-btn:hover .cp-avatar{box-shadow:0 0 0 2px var(--hair-2)}
.cp-avatar-btn:hover{border-color:transparent}
.cp-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:var(--s-2);z-index:120;animation:popIn .18s cubic-bezier(.2,1.2,.4,1)}
.cp-menu-hd{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-2) var(--s-3)}
.cp-avatar-lg{width:38px;height:38px;font-size:15px}
.cp-menu-id{min-width:0}
.cp-menu-name{font-weight:600;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-menu-email{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-menu-sep{height:1px;background:var(--hair);margin:var(--s-1) 0 var(--s-2)}
.cp-menu-item{width:100%;text-align:left;background:transparent;border:0;color:var(--text-2);padding:var(--s-3);border-radius:var(--r-md);font-size:13px;font-weight:500;cursor:pointer;transition:.12s}
/* The base hover is NEUTRAL. This class is shared with PushToggle (the "Slip
 * alerts" row in the same menu), so a blanket destructive hover painted a
 * non-destructive toggle red. The red is scoped to the item that actually
 * destroys something, marked explicitly in components.jsx rather than by
 * position, so inserting a menu item can't silently move it. */
.cp-menu-item:hover{background:rgba(255,255,255,.04)}
.cp-menu-item.is-danger:hover{background:rgba(239,68,68,.12);color:var(--red-2)}

/* ─────────── auth modal ─────────── */
.cp-modal-back{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:rgba(4,4,8,.7);backdrop-filter:blur(8px);
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cp-modal{
  position:relative;width:min(420px,92vw);background:var(--card);
  /* Was `32px 28px 28px`. 28 is a tie between --s-6 and --s-8 and ties round up,
   * which collapses all three sides onto --s-8 — so the 4px "top heavier than
   * sides" asymmetry goes, and the modal grows 4px on three edges. That asymmetry
   * was sub-scale and unexplained; the ✕ it might have been clearing is
   * absolutely positioned at top/right 14px and does not depend on it. */
  border:1px solid var(--hair);border-radius:var(--r-lg);padding:var(--s-8);
  box-shadow:var(--shadow-card);
  max-height:90vh;overflow-y:auto;
  animation:popIn .35s cubic-bezier(.2,1.2,.4,1);
}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.cp-modal-x{position:absolute;top:14px;right:14px;background:transparent;border:0;color:var(--text-3);width:30px;height:30px;border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.cp-modal-x:hover{background:rgba(255,255,255,.06);color:var(--text)}
.cp-modal-logo{display:flex;justify-content:center;margin-bottom:var(--s-5)}
.cp-seg{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2);background:#0c0c14;border:1px solid var(--hair);border-radius:var(--r-md);padding:var(--s-1);margin-bottom:var(--s-4)}
.cp-seg-btn{background:transparent;border:0;color:var(--text-3);padding:var(--s-3);border-radius:var(--r-sm);font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.cp-seg-btn.is-active{background:var(--primary);color:white}
.cp-form{display:flex;flex-direction:column;gap:var(--s-3)}
.cp-form .cp-btn{margin-top:var(--s-1)}

/* ─────────── league / odds / true% ─────────── */
.cp-league{font-weight:600;font-size:12.5px;letter-spacing:.04em}
.cp-tp{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace}
.cp-odd{display:inline-flex;align-items:center;gap:var(--s-1);margin-right:var(--s-2)}
.cp-odd-n{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;color:var(--text-2);font-weight:500}
/* --s-1 both ways. 2px/5px are both sub-scale-ish, but 5px is over the scale's
 * floor so the declaration is not exemptible as a pure optical nudge, and the
 * micro-pill family (.bt-slip-ev, .bt-slip-compact .bt-slip-badge, .cal-legend)
 * already reads --s-1 for its vertical pad — these join it rather than inventing
 * a second answer. The badge gains 2px of height and loses 2px of width. */
.cp-book{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:var(--s-1);border-radius:var(--r-sm)}

/* ─────────── loading / error / empty blocks ─────────── */
/* The six loading / error / empty blocks across Backtest and Analytics were
 * near-identical inline style objects (20px or 32px padding, --text-3 or
 * --text-2, sometimes centered, and the error copies carried the #FCA5A5
 * literal by hand). One pair of classes instead, so they can never drift apart
 * again. 13px matches .bd-empty, which is the same thing for the Boards tables;
 * the inline versions inherited the UA's 16px because nothing sets a body size.
 *
 * --red-2, not --red: this is text. See the token note in :root.
 *
 * The Analytics "no resolved slips yet" block is `an-panel cp-state`, and
 * .an-panel is declared later in this sheet, so the PANEL's padding wins over
 * the one below. That is intended — a panel supplies its own padding and the
 * state class supplies the centering, tone and size. Do not "fix" it by adding
 * specificity here. */
.cp-state{padding:var(--s-8) var(--s-5);text-align:center;color:var(--text-3);font-size:13px}
.cp-state-err{padding:var(--s-8) var(--s-5);text-align:center;color:var(--red-2);font-size:13px}

/* ═══════════════════════════════════════════ LANDING ═══════════════════════════════════════════ */
/* Type scale, spacing and surfaces are shared with the app tabs (same tokens).
 * There are no decorative gradients, blur orbs, grid overlays, conic borders or
 * marquees in this section — the previous version had all five, and they were
 * both the strongest "generated template" signal on the site and the only
 * things on the page doing continuous compositor work. Section rhythm is one
 * value (--lp-gap) so the page reads as a single column of related blocks. */
/* --lp-px is the section gutter, previously a literal 22px repeated in six rules
 * (.lp-hero, .lp-cov, .lp-how, .lp-method, .lp-cta, .lp-foot). 22px is on no step
 * (--s-5 is 20, --s-6 is 24), so it becomes a fluid clamp between them — same
 * pattern as --lp-gap, and it lets narrow viewports keep 20px while wide ones get
 * 24px. NOTE: `.lp` is re-declared in the >=1400px block below to widen
 * --lp-max — grep before adding a token here. */
.lp{--lp-gap:clamp(56px,7vw,96px);--lp-px:clamp(var(--s-5),2.5vw,var(--s-6));--lp-max:1120px}
/* This rule's font-size, line-height and margin are DEAD: every .lp-h1 in the
 * markup is inside .lp-hero-hd, so `.lp-hero .lp-h1` (0,2,0) below wins all
 * three. Editing them here to change the hero is a no-op — edit that rule. */
.lp-h1{font-size:clamp(34px,4.4vw,54px);line-height:1.08;letter-spacing:-.022em;font-weight:700;margin:0 0 var(--s-5);text-wrap:balance}
.lp-h2{font-size:clamp(24px,2.6vw,32px);line-height:1.15;letter-spacing:-.018em;font-weight:700;margin:0 0 var(--s-3);text-wrap:balance}
.lp-h2-sub{color:var(--text-2);font-size:16px;line-height:1.55;margin:0;max-width:56ch}
.lp-section-hd{margin:0 0 var(--s-8)}

/* HERO — minigame v2.
 *
 * The whole point of this block is that the CARD is above the fold. v1 led
 * with a 54px headline and a three-sentence paragraph in a full-width centred
 * column, so on a 1280x800 laptop the game started below the fold and the
 * owner had to scroll to reach the thing the page is for.
 *
 * v2: a two-line tagline + one sentence, then a three-column grid whose middle
 * column is the card. The side columns are the copy that used to be the hero
 * paragraph (left) and the reveal receipt (right) — dead space on either side
 * of a 320px card is what made the v1 hero feel empty.
 *
 * Every vertical value here is part of a height budget measured against
 * 1280x800 (see the .lp-game block below for the card's half). Raising the h1
 * clamp, the hero padding or .lp-hero-hd's margin is what will push the card
 * back under the fold — check before you change one. */
.lp-hero{max-width:var(--lp-max);margin:0 auto;padding:clamp(14px,2vw,24px) var(--lp-px) clamp(34px,4.5vw,60px)}
.lp-hero-hd{max-width:820px;margin:0 auto 14px;text-align:center}
/* Tagline, not a headline: two lines at 1280, three on a phone. */
.lp-hero .lp-h1{font-size:clamp(26px,3.1vw,38px);line-height:1.06;margin:0 0 8px}
.lp-hero-hd .lp-sub{margin:0 auto;font-size:15.5px;max-width:78ch}
.lp-hero .lp-cta-row{justify-content:center;margin-top:16px}
/* Half dead: the only .lp-sub in the markup is inside .lp-hero-hd, so
 * `.lp-hero-hd .lp-sub` (0,2,0) above wins the margin and the font-size. What
 * still applies here is line-height, colour and max-width. */
.lp-sub{font-size:17px;line-height:1.6;color:var(--text-2);max-width:56ch;margin:0 0 var(--s-6)}
.lp-cta-row{display:flex;gap:var(--s-3);flex-wrap:wrap}
.lp-cta-row.lp-center{justify-content:center}

/* Source order is card -> books -> explainer, which IS the <1024px stacking
 * order (and the tab order: the game before the prose, on every width).
 * Desktop only reassigns grid areas — nothing moves in the DOM. */
.lp-hero-grid{
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"card" "books" "why";
  gap:20px;justify-items:center;
}
.lp-hero-mid{grid-area:card;display:flex;justify-content:center;width:100%}
.lp-hero-books{grid-area:books;width:100%;max-width:430px}
/* Visually hidden but readable by assistive tech. Not display:none and not
 * visibility:hidden — both remove the node from the accessibility tree, which
 * would silence the live region this class exists to carry. */
.lp-sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.lp-hero-why{grid-area:why;width:100%;max-width:430px}
@media (min-width:1024px){
  .lp-hero-grid{
    grid-template-columns:minmax(230px,1fr) auto minmax(230px,1fr);
    grid-template-areas:"why card books";
    align-items:center;justify-items:stretch;gap:clamp(18px,2.6vw,40px);
  }
  .lp-hero-books,.lp-hero-why{max-width:none}
  /* No game this session (daily-pick empty/failed): one centred column, not
   * an explainer stranded in the left third of an empty grid. */
  .lp-hero-grid.is-bare{grid-template-columns:minmax(0,1fr);grid-template-areas:"why";justify-items:center}
  .lp-hero-grid.is-bare .lp-hero-why{max-width:620px}
  /* Fill the first screen only when the first screen can actually hold the
   * hero. Centring inside a min-height that the content overflows clips the
   * TOP of the content in flexbox (overflow goes both ways), which would hide
   * the tagline on a short window — so the min-height is gated on a viewport
   * tall enough that it can't happen. */
  @media (min-height:820px){
    .lp-hero{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 62px);min-height:calc(100svh - 62px)}
  }
}
@media (max-width:520px){
  .lp-hero .lp-h1{font-size:25px}
  .lp-hero-hd .lp-sub{font-size:14px}
}

/* Left column: what CoreProp does, in the space beside the card. */
.lp-why-h,.lp-books-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:0 0 var(--s-3)}
.lp-why-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-3)}
.lp-why-steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--s-3);align-items:start}
.lp-why-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--primary-hi);color:var(--primary-2);font-size:11.5px;font-weight:600}
.lp-why-steps b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
/* `div span` scopes this to the step DESCRIPTION only. The step NUMBER is also
 * a <span> (.lp-why-n) but a direct child of the <li>; a bare `.lp-why-steps
 * span` matched it too and, at (0,1,1) vs .lp-why-n's (0,1,0), WON — forcing the
 * digit to display:block (killing place-items:center), nudging it down 3px and
 * recoloring it, so the numbers rendered outside their circles.
 * The 3px margin-top stays literal: it aligns this line's cap height with the
 * digit in the circle beside it, which is optical alignment, not spacing (the
 * scale's first step is 4px). Exempted by name in test_css_tokens.py. */
.lp-why-steps div span{display:block;margin-top:3px;font-size:12.5px;line-height:1.55;color:var(--text-2)}
/* The vig visual. --primary as a FILL (never as text — see the token note at
 * the top of this file) and the game's loss red for the overround, so "the
 * red part is theirs" reads the same here as it does on the card. */
.lp-vig{margin:var(--s-4) 0 0;padding:var(--s-3) var(--s-4);border:1px solid var(--hair);border-radius:var(--radius-sm);background:var(--card)}
.lp-vig-svg{display:block}
.lp-vig-cap{display:flex;gap:var(--s-4);margin:var(--s-2) 0 0;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.lp-vig-cap span{display:inline-flex;align-items:center;gap:var(--s-2)}
.lp-vig-key{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0}
.lp-vig-key.is-fair{background:var(--primary)}
.lp-vig-key.is-vig{background:#FF4A4A}

/* Right column: the reveal. Own tile per book, BookBadge's colours (see
 * components.jsx) so a book is the same colour here as it is on the +EV board.
 * v1 rendered this as 12.5px mono rows crammed under the card. */
.lp-books{background:var(--card);border:1px solid var(--hair-2);border-radius:var(--radius);padding:var(--s-4)}
.lp-books-idle{background:transparent;border-style:dashed;border-color:var(--hair)}
.lp-books-idle-b{margin:0;font-size:13px;line-height:1.6;color:var(--text-3)}
/* Ghost rows hold roughly the height the receipt will need, so the column
 * doesn't jump when the first reveal lands. */
.lp-bk-ghosts{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-4)}
.lp-bk-ghosts span{height:34px;border-radius:var(--r-md);background:rgba(255,255,255,.02);border:1px solid var(--hair)}
.lp-books-live{animation:lpRevealIn .35s ease both}
@keyframes lpRevealIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes lpFadeIn{from{opacity:0}to{opacity:1}}
.lp-books-verdict{margin:0 0 var(--s-3);font-weight:700;font-size:16px}
.lp-books-verdict.is-good{color:#6EFF00}
.lp-books-verdict.is-bad{color:#FF4A4A} /* the one loss red (dots/buttons/X) — no third red */
.lp-books-bars{display:flex;flex-direction:column;gap:var(--s-2);margin:0 0 var(--s-5)}
.lp-books-barrow{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;align-items:center;gap:var(--s-3);font-size:13px}
.lp-books-barlbl{color:var(--text-2);font-weight:600}
.lp-books-bartrack{height:12px;border-radius:4px;background:#0a0a12;border:1px solid var(--hair);overflow:hidden}
/* Animate scaleX, not width — no layout per frame. --p is the probability
 * (0..1) straight off the reveal response, set inline by landing.jsx. */
.lp-books-barfill{display:block;height:100%;background:#4B4C5C;transform-origin:left;animation:lpBarGrow .6s .15s cubic-bezier(.2,.8,.2,1) both}
.lp-books-barfill.is-fav{background:#6EFF00}
@keyframes lpBarGrow{from{transform:scaleX(0)}to{transform:scaleX(var(--p,0))}}
.lp-books-barpct{text-align:right;color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.lp-bk-list{display:flex;flex-direction:column;gap:var(--s-2)}
.lp-bk-head,.lp-bk-row{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px;align-items:center;gap:var(--s-3)}
/* The 1px bottom pad stays literal — it optically seats the uppercase column
 * labels on the first book tile, below the scale's 4px floor. Exempted by name
 * in test_css_tokens.py; the horizontal pad matches .lp-bk-row's --s-3. */
.lp-bk-head{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:0 var(--s-3) 1px}
.lp-bk-head span{text-align:right}
.lp-bk-row{background:var(--bg-2);border:1px solid var(--hair);border-radius:var(--r-md);padding:var(--s-3);min-height:42px}
.lp-bk-id{display:flex;align-items:center;gap:var(--s-2);min-width:0}
.lp-bk-pill{flex-shrink:0;display:inline-grid;place-items:center;min-width:40px;height:22px;padding:0 var(--s-2);border-radius:var(--r-sm);font-size:11px;font-weight:700;letter-spacing:.04em}
.lp-bk-name{font-size:13px;line-height:1.5;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-bk-q{text-align:right;font-size:13.5px;line-height:1.5;color:var(--text-3);font-variant-numeric:tabular-nums}
/* The favoured side is the whole point of the tile — it gets the weight. */
.lp-bk-q.is-fav{color:#6EFF00;font-weight:700}
.lp-books-vig{margin:var(--s-4) 0 0;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.lp-books-close{margin:var(--s-2) 0 0;font-size:13px;line-height:1.5;color:var(--text-2)}
@media (max-width:1023px){
  /* Stacked under the card: the bars and rows read the same, the panel just
   * loses its column framing so it doesn't look like a second card.
   * This used to be 15px 16px against the base rule's 16px 17px — a 1px
   * tightening the 4px scale cannot express, so both now resolve to --s-4 and
   * this declaration is value-identical to the base. Kept as the seam for a
   * real narrow-viewport value; it is a no-op today. */
  .lp-books{padding:var(--s-4)}
}

/* COVERAGE — a definition list, because that's what it is. */
.lp-cov{max-width:var(--lp-max);margin:0 auto;padding:0 var(--lp-px) var(--lp-gap)}
.lp-cov-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;background:var(--hair);border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
@media (max-width:820px){.lp-cov-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.lp-cov-grid{grid-template-columns:1fr}}
.lp-cov-cell{background:var(--bg);padding:var(--s-5)}
.lp-cov-k{font-size:11px;letter-spacing:.04em;color:var(--text-3);font-weight:600}
/* Fluid, and min-width:0 on the cell above, so a long value can't force the
 * grid wider than the viewport (the old stats strip did exactly that between
 * 881px and 1000px). */
.lp-cov-v{font-size:clamp(20px,2.2vw,26px);font-weight:600;letter-spacing:-.01em;margin:var(--s-2) 0 0;line-height:1.15}
.lp-cov-sub{margin:var(--s-2) 0 0;font-size:12px;line-height:1.45;color:var(--text-3)}

/* HOW */
.lp-how{max-width:var(--lp-max);margin:0 auto;padding:0 var(--lp-px) var(--lp-gap)}
.lp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4);counter-reset:none}
@media (max-width:820px){.lp-steps{grid-template-columns:1fr}}
.lp-step{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s-6)}
.lp-step-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary-hi);color:var(--primary-2);font-size:12.5px;font-weight:600}
.lp-step-t{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:var(--s-4) 0 var(--s-2)}
.lp-step-b{color:var(--text-2);font-size:14px;line-height:1.6;margin:0}

/* WHAT YOU GET */
.lp-method{max-width:var(--lp-max);margin:0 auto;padding:0 var(--lp-px) var(--lp-gap)}
.lp-method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-4)}
@media (max-width:820px){.lp-method-grid{grid-template-columns:1fr}}
.lp-method-card{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s-6)}
.lp-method-t{font-size:16.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 var(--s-2)}
.lp-method-b{color:var(--text-2);font-size:14px;line-height:1.6;margin:0}

/* CTA */
.lp-cta{max-width:var(--lp-max);margin:0 auto;padding:0 var(--lp-px) var(--lp-gap)}
/* --r-lg, not --r-xl. On the page this sits directly under the 16px "In the
 * app" cards and beside .lp-books / .lp-cov-grid / .lp-step / .lp-method-card,
 * all 16px — so as the landing page's own hero it is a peer of those cards, not
 * of the pricing hero. --r-xl's two consumers are .pp-card and .pp-card-glow. */
/* The clamp's endpoints were BOTH literal (`36px … 56px`), which made this the
 * one declaration in the stylesheet that derived from nothing while still looking
 * derived — and the reason the marketing and app-screen spacing invariants could
 * not share one pattern, since the app one requires a var() inside any
 * calc()/clamp() and the marketing one had to keep waving any clamp() through.
 *
 * The minimum moves onto the scale (36 is a tie between --s-8 and --s-10, ties
 * round up, so 36 -> 40px) and the maximum stays literal because 56px has no step
 * — --s-12 is 48 and the next would be 64. Token minimum with a literal maximum
 * is the in-file precedent for exactly this: `.pp`'s gutter clamp and
 * `.pp-foot-trust`'s margin-top both do it, and the note above `.pp` in the
 * density-override block spells out the same 56px arithmetic. */
.lp-cta-card{background:var(--card);border:1px solid var(--hair-2);border-radius:var(--r-lg);padding:clamp(var(--s-10),4.5vw,56px) var(--s-6);text-align:center}
.lp-cta-card .lp-h2-sub{margin:0 auto var(--s-6)}

/* FOOTER */
.lp-foot{max-width:var(--lp-max);margin:0 auto;padding:var(--s-8) var(--lp-px) var(--s-10);border-top:1px solid var(--hair)}
.lp-foot-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s-6);flex-wrap:wrap}
.lp-foot-brand{display:flex;align-items:center;gap:var(--s-3)}
.lp-foot-tag{color:var(--text-3);font-size:13px}
.lp-foot-nav{display:flex;gap:var(--s-5);flex-wrap:wrap;font-size:13.5px}
.lp-foot-nav a{color:var(--text-3);border-radius:4px}
.lp-foot-nav a:hover{color:var(--text);text-decoration:underline}
/* --text-3, not --text-4. On the page background --text-4 measures 2.27:1,
 * which fails WCAG AA (4.5:1) for body text — and the text it was applied to is
 * the responsible-gambling notice and the copyright line. --text-3 measures
 * 4.69:1. Do not dim these back down: a legal notice nobody can read is worse
 * than no notice. */
.lp-foot-base{display:flex;justify-content:space-between;gap:var(--s-4);flex-wrap:wrap;margin-top:var(--s-6);padding-top:var(--s-4);border-top:1px solid var(--hair);color:var(--text-3);font-size:12px}
.lp-foot-cov{color:var(--text-3)}
.lp-foot-disc{margin:var(--s-4) 0 0;color:var(--text-3);font-size:12.5px;line-height:1.55;max-width:80ch}

/* MINIGAME (.lp-game) — the hero's daily line challenge (landing.jsx).
 * The card is a deliberate near-clone of the PrizePicks large card, so the
 * "pick a side" gesture is instantly familiar: their measured tokens are
 * #121320 card / #050614 stage / #2C2C39 hairlines / 22px radius / #6EFF00
 * selected / #FF4A4A loss / #93939C + #FBF9FF text. These hexes are PP's, not
 * ours — do not swap them for the site tokens, and don't reuse .bt-slip
 * classes here. The footer carries the non-affiliation line. Win/loss FX
 * (goblin burst, shake, X stamp) are hand-rolled WAAPI in landing.jsx;
 * everything below is layout + states. */
.lp-game{display:flex;flex-direction:column;align-items:center;gap:12px;margin:0}
.lp-game-meter{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-3);font-weight:600;letter-spacing:.03em}
/* Mute toggle, always visible beside the play meter. Small, but a real button
 * with a real focus ring — the site-wide :focus-visible rule covers it. */
.lp-game-mute{display:inline-grid;place-items:center;width:26px;height:26px;padding:0;border-radius:7px;background:transparent;border:1px solid var(--hair);color:var(--text-2);cursor:pointer;transition:background .15s ease,color .15s ease}
.lp-game-mute:hover{background:rgba(255,255,255,.05);color:var(--text)}
.lp-game-mute.is-muted{color:var(--text-3)}
/* The one in-game copy of "Demo only · No wagering · No prizes": visible from
 * the first play (the CTA back panel does NOT repeat it). Negative margin
 * tucks it under the meter instead of consuming a full flex gap. */
.lp-game-demo{margin:-6px 0 0;font-size:11.5px;color:var(--text-3)}
.lp-game-dots{display:inline-flex;gap:6px}
.lp-game-dot{width:6px;height:6px;border-radius:50%;background:var(--card-3);display:inline-block}
.lp-game-dot.is-won{background:#6EFF00;animation:lpDotPop .3s ease}
.lp-game-dot.is-lost{background:#FF4A4A}
@keyframes lpDotPop{0%{transform:scale(1)}50%{transform:scale(1.9)}100%{transform:scale(1)}}
/* PP-dark stage behind the card so it pops on the site's lighter page ground. */
.lp-game-stagebg{background:#050614;border:1px solid #2C2C39;border-radius:26px;padding:18px;display:flex;flex-direction:column;align-items:center}
/* The FX host: position:relative, and exactly the card's box so the loss
 * wash's inset:0 lines up with the card's 22px radius.
 *
 * This replaced a 3D flip container (.lp-game-flip / -inner / -face /
 * -backface, plus the pointer-events + `inert` per-face dance for Safari's
 * hit-testing of the hidden face). The flip existed only to turn the card over
 * to the CTA panel on a 1.6s timer after the third pick; that timer is gone
 * (the third reveal must stay readable — see landing.jsx), which left the flip
 * with no trigger. A returning visitor still gets the CTA panel, rendered flat
 * in the card's place. */
.lp-game-stage{position:relative;width:min(320px,84vw)}
/* The card itself — PP large-card geometry, tightened ~15% from v1 so the
 * whole card AND its action button clear a 1280x800 fold. */
.lp-game-card{background:#121320;border:1px solid #2C2C39;border-radius:22px;overflow:hidden;transition:border-color .25s ease}
.lp-game-card.is-winner{border-color:#6EFF00}
.lp-game-body{display:flex;flex-direction:column;transition:filter .3s ease}
/* Loss: content (not the border) desaturates until "Next pick". */
.lp-game-body.is-lost{filter:grayscale(.75) brightness(.85)}
/* flex-end: only the trending flame lives here now (PP's "L5" chip is not
 * cloned — it implies last-5-games data the payload doesn't carry). */
.lp-game-top{display:flex;justify-content:flex-end;align-items:center;padding:10px 14px 2px;min-height:20px}
.lp-game-trend{display:inline-flex;align-items:center;gap:5px;color:#FBF9FF;font-size:13px;font-weight:500}
.lp-game-photo{height:118px;display:grid;place-items:center}
.lp-game-photo img{max-height:118px;max-width:78%;object-fit:contain;display:block}
/* Image fallback: initials tile, same idiom as the nav avatar — never a
 * broken-image glyph. */
.lp-game-photo-fb{width:72px;height:72px;border-radius:16px;background:#23242F;color:#BAB9C1;display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.04em}
.lp-game-meta{text-align:center;padding:2px 16px 0}
.lp-game-teampos{color:#93939C;font-size:13px}
.lp-game-player{color:#FBF9FF;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.lp-game-matchup{margin-top:2px;font-size:13px}
.lp-game-matchup b{color:#FBF9FF;font-weight:700}
.lp-game-matchup span{color:#93939C}
.lp-game-line{display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 14px 12px}
.lp-game-swap{width:30px;height:30px;border-radius:50%;background:#23242F;display:grid;place-items:center;flex-shrink:0}
.lp-game-num{color:#FBF9FF;font-size:28px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.lp-game-prop{color:#93939C;font-size:15px}
/* Less / More: real buttons, full card width, center hairline. */
.lp-game-btns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #2C2C39;height:52px}
.lp-game-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:transparent;border:0;color:#FBF9FF;font-size:16px;font-weight:600;cursor:pointer;height:100%;border-radius:0;transition:background .15s ease,color .15s ease}
.lp-game-btn svg{flex-shrink:0}
.lp-game-btn-r{border-left:1px solid #2C2C39}
.lp-game-btn:disabled{cursor:default}
.lp-game-btn.is-sel,.lp-game-btn.is-win{background:#6EFF00;color:#050614}
.lp-game-btn.is-loss{background:#FF4A4A;color:#050614}
/* Idle nudge: soft inner green pulses alternating between the halves (offset
 * half a cycle) purely to invite a tap. No copy, no odds claim. Known
 * tradeoff vs the LANDING block's no-continuous-work rule: an infinite
 * box-shadow loop repaints two buttons while the hero is idle. Accepted
 * deliberately — the invite is the point of the game — and it stops the
 * moment a side is picked (.is-idle drops). */
/* Animating box-shadow repaints the button every frame, forever, even when the
 * hero is scrolled out of view — it was a standing cost on the one page every
 * visitor lands on. The glow is now a static inset shadow painted once on a
 * pseudo-element, and only its OPACITY animates, which the compositor handles
 * without repainting anything. */
@keyframes lpNudge{0%,100%{opacity:0}50%{opacity:1}}
.lp-game-btns.is-idle .lp-game-btn{position:relative}
.lp-game-btns.is-idle .lp-game-btn::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 26px rgba(110,255,0,.20);
  animation:lpNudge 2s ease-in-out infinite}
.lp-game-btns.is-idle .lp-game-btn-r::after{animation-delay:1s}
/* FX layer (win burst / loss stamp). Appended and removed by landing.jsx,
 * aria-hidden, never interactive.
 *
 * overflow:clip, not visible: the burst arcs travel ~160px horizontally, which
 * on a narrow viewport extended the document's scroll width and made a
 * horizontal scrollbar flicker in and out mid-animation. Clipping costs a few
 * particles at the very edge of their arc, well after they've faded. */
.lp-game-fx{position:absolute;inset:0;pointer-events:none;overflow:clip;z-index:5}
/* No will-change here. WAAPI transform/opacity animations self-promote for
 * their duration; declaring the hint promoted all ~44 particles to their own
 * compositor layer simultaneously AND kept them promoted after the animation
 * ended, which is what made the win burst stutter on lower-end machines. */
.lp-game-particle{position:absolute;display:block;line-height:0}
.lp-game-confetti{background:#6EFF00;border-radius:1px}
.lp-game-flash{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(110,255,0,.55),rgba(110,255,0,0) 70%)}
.lp-game-evchip{position:absolute;padding:4px 11px;border-radius:999px;background:#0A2A12;border:1px solid rgba(110,255,0,.4);color:#6EFF00;font-weight:800;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.lp-game-wash{position:absolute;inset:0;background:rgba(255,74,74,.5);border-radius:22px}
.lp-game-stamp{position:absolute;left:50%;top:50%;line-height:0}
/* The one `lp-game-*` rule on the site palette rather than the PrizePicks clone
 * palette, and so the one deliberate exception to "do not touch the minigame".
 * #FCA5A5 is CoreProp's error red (--red-2); PP's loss red is #FF4A4A and stays
 * literal everywhere it appears. This element is also the only part of the game
 * that renders *outside* the PP card — it is the role="alert" status line beneath
 * it. Value-identical swap. */
.lp-game-err{margin:12px 0 0;font-size:12.5px;color:var(--red-2);text-align:center}
/* THE next action, on the card. Ben on v1: "the next pick button has to be
 * easier to reach or easier to see, it should be largely shown maybe even on
 * the player 'card' itself". So: full card width, 54px tall, filled --primary
 * (white on it clears AA — see the token note at the top of this file), and
 * the ONLY control on screen once a pick is graded.
 *
 * It is a sibling of .lp-game-body, not a child, because .is-lost puts a
 * grayscale filter on the body and the live control must not inherit it.
 *
 * Deliberately the SAME blue for both labels ("Next pick" and, on the last
 * pick, "See pricing"). Recolouring the third one green would read as a win
 * state on a card the visitor may have just lost. */
.lp-game-act{padding:12px;border-top:1px solid #2C2C39}
.lp-game-actbtn{display:block;width:100%;height:54px;padding:0;border:0;border-radius:14px;background:var(--primary);color:#fff;font-family:inherit;font-size:16.5px;font-weight:700;letter-spacing:.005em;cursor:pointer;transition:background .15s ease,transform .08s ease;animation:lpActIn .28s ease both}
.lp-game-actbtn:hover{background:#195F97}   /* hover DARKENS — see .cp-btn-primary */
.lp-game-actbtn:active{transform:translateY(1px)}
@keyframes lpActIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Skeleton held while /api/public/daily-pick is in flight, at the real card's
 * geometry. Before it, the hero painted its header and then grew ~440px of
 * card underneath a beat later — half of "takes WAY too long to load" was that
 * layout shift, not the fetch. */
.lp-sk{display:block;border-radius:var(--r-sm);background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.085),rgba(255,255,255,.035));background-size:200% 100%;animation:lpSkShimmer 1.25s linear infinite}
@keyframes lpSkShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* These two min-heights are not cosmetic: they make the skeleton's meter row
 * and flame row measure the same as the loaded card's, so the swap costs 0px
 * of layout shift. Measured against the real card at 1280px — meter 26px,
 * .lp-game-top 28px, card 318px, .lp-game 414px. */
.lp-game-sk .lp-game-meter{min-height:26px}
.lp-game-sk .lp-game-top{min-height:28px}
.lp-sk-meter{width:134px;height:13px}
.lp-sk-photo{width:72px;height:72px;border-radius:16px}
.lp-sk-l1{width:96px;height:11px;margin:2px auto 0}
.lp-sk-l2{width:168px;height:18px;margin:9px auto 0}
.lp-sk-l3{width:132px;height:11px;margin:9px auto 0}
.lp-sk-line{width:176px;height:30px;margin:2px auto}
.lp-sk-btn{display:block;height:100%;background:rgba(255,255,255,.02)}
.lp-sk-btn + .lp-sk-btn{border-left:1px solid #2C2C39}
/* CTA panel (returning visitor, three plays already spent), and its dismissed
 * one-line remnant. */
.lp-game-ctap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:#121320;border:1px solid #2C2C39;border-radius:22px;padding:30px 22px;min-height:300px;width:100%}
.lp-game-ctap-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:var(--r-sm);background:transparent;border:0;color:#93939C;cursor:pointer;font-size:14px}
.lp-game-ctap-x:hover{background:rgba(255,255,255,.06);color:#FBF9FF}
.lp-game-ctap-h{margin:0;font-size:22px;font-weight:700;color:#FBF9FF;letter-spacing:-.01em}
.lp-game-ctap-sub{margin:0;font-size:14px;line-height:1.55;color:var(--text-2);max-width:34ch}
.lp-game-minbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair-2);border-radius:999px;padding:8px 8px 8px 18px;font-size:12.5px;color:var(--text-3)}
/* prefers-reduced-motion. The global .01ms clamp near the top of this file
 * kills every animation here (idle nudge, reveal slide, action-button rise,
 * skeleton shimmer), and landing.jsx separately skips the particle FX, the
 * shake and the pop, and seeds the sound default to muted (lpReducedMotion).
 *
 * What that clamp gets wrong on its own is that the receipt and the on-card
 * action button then materialise with no transition at all, which is its own
 * kind of disorienting. Re-grant an OPACITY fade for those two — and only
 * opacity: no transform, no translate, no scale.
 *
 * The clamp is `!important` on `*`, so a re-grant must be `!important` too;
 * a class selector then wins on specificity. (An earlier version of this
 * block was dead code because the elements it named animated transform only.
 * lpFadeIn is opacity-only, so it actually has something to run on.) */
@media (prefers-reduced-motion:reduce){
  .lp-books-live,.lp-game-actbtn{animation:lpFadeIn .3s ease both!important}
  /* The bars use fill `both`, so the clamp lands them straight on their final
   * scaleX — the right value, just without the growth. Left alone. */
  /* The skeleton shimmer is an infinite loop: stop it, keep the block. */
  .lp-sk{animation:none!important;background:rgba(255,255,255,.05)}
}

/* ═══════════════════════════════════════════ +EV PAGE ═══════════════════════════════════════════ */
.ev{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - var(--nav-h))}
@media (max-width:1100px){.ev{grid-template-columns:1fr}}
/* Re-declared twice below (density overrides, then @media 900 twice) — those
 * copies win, so a change here alone is invisible. 80px is off the scale
 * deliberately: it is scroll runway under the last table row, not a gutter. */
.ev-main{padding:var(--s-6) var(--s-6) 80px;min-width:0}

/* Filters */
/* margin-bottom is mirrored as a NEGATIVE margin on .ev-slip.ev-slip-mobile in
 * the @media 900 block, which pulls the mobile slip drawer up flush against this
 * tile. Both read --s-4 so they cannot drift; changing one alone reopens a gap
 * (or an overlap) between the tile and the drawer. */
.ev-filters{display:flex;align-items:flex-end;gap:var(--s-5);flex-wrap:wrap;padding:var(--s-5);background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:var(--s-4)}
.ev-filter{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.ev-filter-grow{flex:1;min-width:200px}
.ev-filter label{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3)}
.ev-chips{display:flex;gap:var(--s-1);flex-wrap:wrap}
/* height:34px matches .cp-input-sm and .ev-stepper. The filter bar is
 * `align-items:flex-end`, so a chip row that computed to 31px sat 3px shorter
 * than the text inputs beside it and dragged its own "LEAGUE" / "SIDE" label
 * 3px down out of line with "PROP TYPE" / "MIN TRUE %". Vertical padding is
 * dropped in favour of flex centring so the height is exact at any font-size. */
/* --r-sm, not --r-pill. Pill chips are the more modern shape in isolation, but
 * this chip shares one wrapping tile with .ev-stepper (--r-sm), .ev-clear
 * (--r-sm) and .cp-input-sm (--r-md). Pilling only the chip put four corner
 * treatments in one bar, with a pill sitting directly against an 8px Clear at
 * 375px — less consistent than the 8/10/8/8 it replaced. Matching .ev-stepper
 * keeps the bar one family. Pilling the other three instead would drag
 * .cp-input-sm's shape across the whole app. */
.ev-chip{background:#0a0a12;border:1px solid var(--hair);color:var(--text-2);height:34px;padding:0 var(--s-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;cursor:default;transition:.15s}
.ev-chip:hover{border-color:var(--hair-2);color:var(--text)}
.ev-chip.is-on{background:var(--primary);border-color:var(--primary);color:white}
.ev-stepper{display:flex;align-items:center;background:#0a0a12;border:1px solid var(--hair);border-radius:var(--r-sm);overflow:hidden}
.ev-stepper button{background:transparent;border:0;color:var(--text-2);width:30px;height:32px;cursor:default;font-size:14px;font-weight:600}
.ev-stepper button:hover{background:rgba(255,255,255,.05);color:white}
.ev-stepper span{padding:0 var(--s-3);font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--text)}
/* The one 9px vertical padding on this page that does NOT go to --s-3. This
 * button sits in an `align-items:flex-end` filter row whose other controls
 * (.ev-chip, .cp-input-sm, .ev-stepper) are all exactly 34px, and the height
 * note above .cp-btn-sm records that .ev-clear shares that 34px baseline
 * deliberately. Measured: --s-3 (12px) top/bottom makes it 42px, 8px taller
 * than everything beside it, with its top edge floating above the input's.
 * So it takes the same explicit-height contract .bd-clear already uses —
 * horizontal padding on the scale, height pinned to the row. That also closes
 * the 2px the old 9px padding was over (it computed to 36px, not 34px). */
.ev-clear{margin-left:auto;background:transparent;border:1px solid var(--hair);color:var(--text-2);padding:0 var(--s-4);height:34px;display:inline-flex;align-items:center;border-radius:var(--r-sm);font-size:13px;cursor:default;align-self:flex-end}
.ev-clear:hover{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:var(--red-2)}
/* Slip Builder toggle — desktop hides it (the sidebar aside is always visible
 * there). On mobile (block at the end of the sheet) it becomes a full-width
 * grey bar at the bottom of the config tile. */
.ev-slip-toggle{display:none;justify-content:center;align-items:center;gap:var(--s-2);background:#1b1b26;border:1px solid var(--hair-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.ev-slip-toggle:hover{background:#20202c}
.ev-slip-toggle.is-on{background:#20202c;color:var(--primary-2)}
.ev-slip-toggle-caret{font-size:10px;transition:transform .15s ease}
.ev-slip-toggle-caret.is-open{transform:rotate(180deg)}
/* The mobile slip dropdown is hidden everywhere by default; the mobile media
 * block reveals .is-open. On desktop it never shows (the sidebar handles it).
 * Two-class selector so it beats the later single-class `.ev-slip{display:flex}`
 * base rule, which the panel also carries. */
.ev-slip.ev-slip-mobile{display:none}

/* flex-wrap so the added legend can drop to its own line on a phone instead of
 * squeezing the freshness text; row-gap keeps the two lines from touching. */
.ev-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);row-gap:var(--s-2);padding:0 var(--s-2) var(--s-4);color:var(--text-3);font-size:13px}
.ev-meta b{color:var(--text)}
.ev-meta-dot{color:var(--text-4)}
.ev-meta-pag{margin-left:auto;font-family:"JetBrains Mono",monospace;color:var(--text-3)}
/* Red-row key. The swatch is a miniature of .ev-row-data.is-logged — same 3px
 * left border, same flat tint — so the mapping to the table needs no words. It
 * followed that rule's gradient before Phase 2a flattened it; if the row's tint
 * ever changes again, this changes with it or the key stops matching the thing
 * it explains. border-radius:3px is intentional and exempt from the radius
 * scale (see RADIUS_EXEMPT) — a 12px-tall chip on --r-sm reads as a pill. */
.ev-legend{display:inline-flex;align-items:center;gap:var(--s-2);color:var(--red-2);cursor:help}
.ev-legend-swatch{
  width:24px;height:12px;border-radius:3px;flex-shrink:0;
  border-left:3px solid var(--red);
  background:rgba(239,68,68,.16);
}
.ev-pulse{color:var(--green);font-style:normal;font-weight:600}

/* ───────── Auto-place bar ─────────
 * Prominent, inline, top of the +EV tab and the Backtest page. Arms in two
 * taps (consent, then mode) so it is usable one-handed on a phone — the whole
 * reason it moved out of the avatar dropdown. */
/* Flat tints, not gradients — tests/api_tests/test_css_guards.py bans accent
 * gradients project-wide, and this bar is no exception. */
.ap-bar{
  background:rgba(30,111,176,.08);
  border:1px solid rgba(30,111,176,.38);border-radius:var(--r-lg);
  padding:var(--s-3) var(--s-4);margin:0 0 var(--s-4);
}
/* Armed is RED, not green: "on" means entries get submitted. */
.ap-bar.is-armed{
  background:rgba(239,68,68,.11);
  border-color:rgba(239,68,68,.5);
}
.ap-bar-main{display:flex;align-items:center;gap:var(--s-3)}
.ap-bar-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--primary);
}
.ap-bar.is-armed .ap-bar-dot{background:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.18)}
.ap-bar-txt{flex:1 1 auto;min-width:0}
.ap-bar-t{font-size:14px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.ap-bar-s{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.35}
.ap-bar-cfg{
  flex-shrink:0;background:none;border:1px solid var(--hair);color:var(--text-2);
  border-radius:var(--r-sm);width:34px;height:34px;font-size:14px;cursor:pointer;
}
.ap-bar-cfg:hover{border-color:var(--primary);color:var(--text)}
.ap-bar-consent{
  display:flex;gap:var(--s-2);align-items:flex-start;margin:var(--s-3) 0 0;
  font-size:12.5px;line-height:1.4;color:var(--text-2);cursor:pointer;
}
.ap-bar-consent input{margin-top:2px;flex-shrink:0}
.ap-bar-actions{display:flex;gap:var(--s-2);margin-top:var(--s-3)}
.ap-bar-btn{
  flex:1 1 0;min-height:40px;                 /* full-width touch targets */
  border:1px solid var(--hair);background:rgba(255,255,255,.06);color:var(--text);
  border-radius:var(--r-md);font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.ap-bar-btn:hover:not(:disabled){background:rgba(255,255,255,.10);border-color:var(--primary)}
.ap-bar-btn:disabled{opacity:.42;cursor:not-allowed}
.ap-bar-live{border-color:rgba(239,68,68,.45);color:#FECACA}
.ap-bar-live.is-confirm{background:var(--red);border-color:var(--red);color:#fff}
.ap-bar-off{flex:0 0 auto;padding:0 var(--s-5)}
.ap-bar-err{margin-top:var(--s-2);font-size:12.5px;color:var(--red-2)}

/* ───────── Auto-place panel ─────────
 * The arming UI for real-money auto-submission. Sized mobile-first: the whole
 * point of this control is that it is reachable from the installed PWA, where
 * the only other place it existed (the native iOS app) is not an option. */
.ap-modal-back{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.62);
  display:grid;place-items:center;padding:var(--s-4);
}
.ap-modal{
  width:min(420px,100%);max-height:88vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--hair);border-radius:var(--r-xl);
  padding:var(--s-5) var(--s-5) var(--s-4);box-shadow:var(--shadow-card);
}
.ap-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-3)}
.ap-hd h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.ap-x{background:none;border:0;color:var(--text-3);font-size:16px;cursor:pointer;padding:var(--s-1) var(--s-2)}
/* Armed state is red, not green: "on" here means money can leave. */
.ap-state{
  font-size:13.5px;font-weight:600;padding:var(--s-2) var(--s-3);border-radius:var(--r-md);
  background:rgba(255,255,255,.04);border:1px solid var(--hair);color:var(--text-2);
}
.ap-state.is-on{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:#FECACA}
.ap-sub{font-size:12px;color:var(--text-3);margin:var(--s-2) var(--s-1) 0}
.ap-field{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin-top:var(--s-3)}
.ap-field label{font-size:13px;color:var(--text-2)}
.ap-field input{width:110px;text-align:right}
.ap-consent{
  display:flex;gap:var(--s-2);align-items:flex-start;margin:var(--s-4) 0 var(--s-1);
  font-size:12.5px;line-height:1.45;color:var(--text-2);cursor:pointer;
}
.ap-consent input{margin-top:2px;flex-shrink:0}
.ap-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2);margin-top:var(--s-4)}
/* The three mode buttons inherit .cp-btn, which on this surface renders with
 * no border or fill — they read as plain text rather than controls. Give them
 * explicit chrome: these decide whether real money moves, so "looks tappable"
 * is a safety property, not decoration. */
.ap-actions .cp-btn{
  border:1px solid var(--hair);background:rgba(255,255,255,.05);color:var(--text);
  border-radius:var(--r-md);padding:var(--s-3) var(--s-1);font-size:13.5px;font-weight:600;
  min-height:42px;               /* comfortable touch target on a phone */
  cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.ap-actions .cp-btn:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:var(--primary)}
.ap-actions .cp-btn:disabled{opacity:.42;cursor:not-allowed}
/* The confirm state for LIVE — deliberately alarming. */
.ap-danger{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.ap-note{font-size:11.5px;line-height:1.5;color:var(--text-3);margin:var(--s-3) 0 0}
.ap-err{margin-top:var(--s-3);font-size:12.5px;color:var(--red-2)}
.ap-ok{margin-top:var(--s-3);font-size:12.5px;color:var(--green-2)}

/* Table */
.ev-table{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden}
/* Airy row: one flex line with an identity/meta zone that grows and a fixed
 * right zone for the hero true% + add button. This replaced a 9-track grid; the
 * 9 columns now live as THREE stacked lines inside .ev-row-main — .ev-player,
 * .ev-row-meta, .ev-books (see ev-page.jsx, whose comment says three; this one
 * said two and was simply wrong).
 * Padding stays on --row-px — and the copy in the density-overrides block below
 * is the one that actually wins, so both must carry it. */
.ev-row{
  display:flex;
  align-items:flex-start;
  gap:var(--s-4);
  padding:var(--s-4) var(--row-px);
  border-bottom:1px solid var(--hair);
  font-size:13.5px;
  cursor:default;
  transition:background .12s ease;
}
.ev-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s-2)}
.ev-row-side{display:flex;align-items:center;gap:var(--s-3);flex-shrink:0}
.ev-row-meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-2);font-size:12.5px;color:var(--text-3)}
/* Wrap units inside the meta line. Each keeps a pair that reads as one thing
 * from being split across a wrap: the bet itself (SIDE + line) and the game
 * time with its leading separator. Without these, 375px split UNDER from 1.5 in
 * every row measured and orphaned the separator in two thirds of them. */
.ev-bet{display:inline-flex;align-items:center;gap:var(--s-2);white-space:nowrap}
.ev-when{display:inline-flex;align-items:center;gap:var(--s-2);white-space:nowrap}
/* Each line inside the identity zone must be allowed to shrink below its own
 * content width, or a long value (e.g. a full player name, or the
 * "Hits+Runs+RBIs" prop) pushes .ev-row-main wider than the row and squeezes the
 * right zone. Flex items default to min-width:auto, so this is not redundant
 * with .ev-row-main's own min-width:0. This was `.ev-row>span` while the row was
 * a grid of spans; the direct children are now .ev-row-main / .ev-row-side. */
.ev-row-main>*{min-width:0}
/* Row/leg entrance. Defined here, next to its only two consumers — it used to
 * sit in the LANDING block, which is why it survived that block's rewrite only
 * by accident. */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev-row-data{animation:fadeUp .35s ease both}
/* DEAD for every default user: app-main.jsx injects
 * `.app:not(.tint-on) .ev-row-data:hover` at (0,4,0) into <head>, and tableTint
 * defaults to "off" so that selector always matches. This (0,2,0) rule only
 * renders with the dev tweaks panel's row-tint switched on. Editing it to change
 * the hover look does nothing — that lives in app-main.jsx. */
.ev-row-data:hover{background:rgba(30,111,176,.05)}
/* Selected row: the 3px accent border must be subtracted from the row's own
 * horizontal padding, or the whole row's content shifts right relative to every
 * unselected row. The padding is `var(--row-px)` — the ONLY definition of it, declared
 * once in :root precisely so this calc() cannot go stale. It used to hardcode
 * `calc(16px - 2px)` against a flat-18px row, then `calc(clamp(18px,2vw,24px) -
 * 2px)`: the first left every selected row 6px out of alignment at wide
 * viewports, and the second was a literal that had to be edited in lockstep
 * with two other rules. Reference the token; never re-type its value.
 * Mirrors what .is-logged does for its own 3px border — the two bars are
 * deliberately the same width so ONE compensation value serves both, including
