[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:apscheduler.*
    ignore::DeprecationWarning:dateutil.*
markers =
    slow: tests that pull large fixtures or simulate full pipelines
    integration: tests that require a live Supabase (skipped in CI)
